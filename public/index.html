<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div id="auth-screen" class="container">
        <h2 id="auth-title">Entrar</h2>
        <form id="auth-form" onsubmit="event.preventDefault(); handleAuth()">
            <input type="email" id="auth-email" placeholder="E-mail" required autocomplete="username">
            <input type="password" id="auth-pass" placeholder="Senha" required autocomplete="current-password">
            <input type="text" id="auth-name" placeholder="Seu Nome de Exibição" class="hidden">
            <button id="auth-btn">Entrar</button>
        </form>
        <div class="link" onclick="toggleAuthMode()">Não tem conta? Crie uma</div>
    </div>

    <div id="main-screen" class="app-screen hidden">
        <div class="main-header">
            <button class="icon-btn" onclick="toggleMenu('main-menu')"><span class="material-icons">menu</span></button>
            <span class="header-title">Conversas</span>
            <div style="width: 40px;"></div>
        </div>

        <div id="main-menu" class="dropdown-menu hidden">
            <div class="menu-item" onclick="alert('Em breve: Criar Grupo')"><span class="material-icons">group_add</span> Criar Grupo</div>
            <div class="menu-item" onclick="alert('Em breve: Agendar')"><span class="material-icons">schedule_send</span> Agendar Mensagem</div>
            <div class="menu-item" onclick="openSettings()"><span class="material-icons">settings</span> Configurações</div>
            <div class="menu-item logout" onclick="logout()"><span class="material-icons">logout</span> Sair</div>
        </div>

        <div id="users-list" class="contact-list"></div>
    </div>

   <div id="chat-screen" class="app-screen hidden">
        <div class="chat-header">
            <button class="icon-btn" onclick="backToMain()"><span class="material-icons">arrow_back</span></button>
            <div class="chat-info">
                <img id="chat-avatar" src="" class="avatar-small">
                <div class="chat-texts">
                    <span id="chat-title">Nome</span>
                </div>
            </div>
            <button class="icon-btn" onclick="toggleMenu('attach-menu')"><span class="material-icons">attach_file</span></button>
        </div>

        <div id="attach-menu" class="dropdown-menu right-menu hidden">
            <input type="file" id="file-input" hidden onchange="handleFileUpload(this)">
            <div class="menu-item" onclick="triggerUpload('image/*')"><span class="material-icons" style="color:#d3396d">image</span> Foto</div>
            <div class="menu-item" onclick="triggerUpload('application/pdf')"><span class="material-icons" style="color:#e03c31">picture_as_pdf</span> PDF</div>
            <div class="menu-item" onclick="startRecording()"><span class="material-icons" style="color:#008069">mic</span> Áudio</div>
        </div>

        <div id="chat-box"></div>

        <div id="floating-toolbar" class="floating-toolbar hidden">
            <div class="toolbar-group">
                <button onmousedown="formatDoc('bold', event)" title="Negrito"><b>B</b></button>
                <button onmousedown="formatDoc('italic', event)" title="Itálico"><i>I</i></button>
                <button onmousedown="formatDoc('underline', event)" title="Sublinhado"><u>U</u></button>
                <button onmousedown="formatDoc('strikeThrough', event)" title="Riscado"><s>S</s></button>
            </div>
            <div class="toolbar-separator"></div>
            <div class="toolbar-group">
                <button onmousedown="formatDoc('fontName', event, 'Arial')" style="font-family:Arial">Arial</button>
                <button onmousedown="formatDoc('fontName', event, 'Georgia')" style="font-family:Georgia">Geo</button>
                <button onmousedown="formatDoc('fontName', event, 'Courier New')" style="font-family:Courier New">Mono</button>
                <button onmousedown="formatDoc('fontName', event, 'Comic Sans MS')" style="font-family:Comic Sans MS">Comic</button>
                <button onmousedown="formatDoc('fontName', event, 'Impact')" style="font-family:Impact">Imp</button>
            </div>
        </div>

        <div class="input-area">
            <button class="icon-btn" onclick="toggleEmojiPicker()"><span class="material-icons" style="color:#54656f">sentiment_satisfied_alt</span></button>
            <emoji-picker id="emoji-picker" class="hidden"></emoji-picker>

            <div id="message-input" contenteditable="true" placeholder="Mensagem..." onmouseup="checkSelection()" onkeyup="checkSelection()"></div>
            
            <button class="send-btn" onclick="sendMessage()"><span class="material-icons">send</span></button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Meu Perfil</h3>
            <div class="profile-edit">
                <img id="settings-avatar" src="" onclick="triggerProfileUpload()">
                <p style="font-size:12px; color:#666;">Toque na foto para alterar</p>
                <input type="file" id="profile-file-input" hidden onchange="uploadProfilePhoto(this)">
            </div>
            <input type="text" id="settings-name" placeholder="Seu Nome de Exibição">
            <div class="modal-actions">
                <button onclick="closeSettings()" style="background:#ccc;">Cancelar</button>
                <button onclick="saveProfile()" style="background:#008069;">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
