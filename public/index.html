<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zap Privado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="register-screen" class="container">
        <h2>Criar Conta</h2>
        <form onsubmit="event.preventDefault(); register()">
            <input type="email" id="reg-email" placeholder="Email"><input type="password" id="reg-pass" placeholder="Senha"><button>Cadastrar</button>
        </form>
        <div class="link" onclick="showLogin()">Já tenho conta</div>
    </div>

    <div id="verify-screen" class="container hidden">
        <h2>Verificar</h2>
        <p>Veja o código no terminal preto.</p>
        <input type="text" id="verify-code" placeholder="Código"><button onclick="verify()">Validar</button>
    </div>

    <div id="login-screen" class="container hidden">
        <h2>Entrar</h2>
        <form onsubmit="event.preventDefault(); login()">
            <input type="email" id="login-email" placeholder="Email"><input type="password" id="login-pass" placeholder="Senha"><button>Entrar</button>
        </form>
        <div class="link" onclick="showRegister()">Criar conta</div>
    </div>

    <div id="chat-screen" class="chat-app hidden">
        
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Contatos</span>
                <button onclick="logout()" style="width:auto; padding: 5px; background: crimson;">Sair</button>
            </div>
            <div id="users-list">
                </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chat-title">Selecione um contato...</h3>
            </div>
            <div id="chat-box"></div>
            <div id="feedback-area" style="padding: 0 20px; height: 20px; font-size: 12px; color: #666; font-style: italic;"></div>
            <div class="input-area hidden" id="input-area">
                <input type="text" id="message-input" placeholder="Mensagem..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
