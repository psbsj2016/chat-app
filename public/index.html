<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <div id="auth-screen" class="container">
        <h2 id="auth-title">Entrar</h2>
        <form id="auth-form" onsubmit="event.preventDefault(); handleAuth()">
            <input type="email" id="auth-email" placeholder="E-mail" required>
            <input type="password" id="auth-pass" placeholder="Senha" required>
            <input type="text" id="auth-name" placeholder="Seu Nome de Exibição" class="hidden">
            <button id="auth-btn">Entrar</button>
        </form>
        <div class="link" onclick="toggleAuthMode()">Não tem conta? Crie uma</div>
    </div>

    <div id="chat-screen" class="app-screen hidden">
        <div class="chat-header">
            <button class="icon-btn" onclick="backToMain()"><span class="material-icons">arrow_back</span></button>
            <div class="chat-info">
                <img id="chat-avatar" src="" class="avatar-small">
                <div class="chat-texts">
                    <span id="chat-title">Nome</span>
                </div>
            </div>
            <button class="icon-btn" onclick="toggleMenu('attach-menu')"><span class="material-icons">attach_file</span></button>
        </div>

        <div id="attach-menu" class="dropdown-menu right-menu hidden">
            <input type="file" id="file-input" hidden onchange="handleFileUpload(this)">
            
            <div class="menu-item" onclick="triggerUpload('image/*')"><span class="material-icons" style="color:#d3396d">image</span> Fotos e Vídeos</div>
            <div class="menu-item" onclick="triggerUpload('application/pdf')"><span class="material-icons" style="color:#e03c31">picture_as_pdf</span> Documento</div>
            <div class="menu-item" onclick="startRecording()"><span class="material-icons" style="color:#008069">mic</span> Áudio (Gravar)</div>
        </div>

        <div id="chat-box"></div>

        <div class="input-area">
            <button class="icon-btn" onclick="toggleMenu('style-menu')"><span class="material-icons">text_format</span></button>
            
            <div id="style-menu" class="style-popup hidden">
                <button onclick="formatDoc('bold')" style="font-weight:bold">B</button>
                <button onclick="formatDoc('italic')" style="font-style:italic">I</button>
                <button onclick="formatDoc('underline')" style="text-decoration:underline">U</button>
                <div style="width:1px; height:20px; background:#ddd; margin:0 5px;"></div>
                <button onclick="formatDoc('fontName','Arial')" style="font-family:Arial">A</button>
                <button onclick="formatDoc('fontName','Courier New')" style="font-family:Courier New">C</button>
                <button onclick="formatDoc('fontName','Georgia')" style="font-family:Georgia">G</button>
                <button onclick="formatDoc('fontName','Times New Roman')" style="font-family:Times New Roman">T</button>
                <button onclick="formatDoc('fontName','Verdana')" style="font-family:Verdana">V</button>
            </div>

            <button class="icon-btn" onclick="toggleEmojiPicker()"><span class="material-icons">sentiment_satisfied_alt</span></button>
            
            <emoji-picker id="emoji-picker" class="hidden"></emoji-picker>

            <div id="message-input" contenteditable="true" placeholder="Mensagem..."></div>

            <button class="send-btn" onclick="sendMessage()"><span class="material-icons">send</span></button>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
