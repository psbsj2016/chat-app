<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predator 3D: Survival</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --hud-bg: #0f172a;
            --primary: #4ade80;
            --danger: #ef4444;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { background-color: #020617; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* HUD SUPERIOR */
        #hud {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.95); padding: 10px 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1); color: #fff; z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 800; }
        .stat-value { font-size: 18px; font-weight: 900; font-family: 'Orbitron'; }
        
        .progress-container { flex: 1; margin: 0 15px; display: flex; flex-direction: column; align-items: center; }
        .progress-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #4ade80); width: 0%; transition: width 0.3s; }

        /* ÁREA DO JOGO (INFINITA) */
        #game-area {
            flex: 1; position: relative; width: 100%; overflow: hidden;
            background: #1e293b; transition: background 1s ease;
        }
        canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); }

        /* CONTROLOS INFERIORES (D-PAD ERGONÔMICO) */
        #controls-wrapper {
            background: var(--hud-bg); border-top: 2px solid rgba(255,255,255,0.05);
            display: flex; justify-content: center; align-items: center; padding: 25px 0 35px 0;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5); z-index: 10;
        }
        
        /* CRUZ COM ESPAÇAMENTO PERFEITO */
        #d-pad {
            display: grid;
            grid-template-columns: 65px 65px 65px;
            grid-template-rows: 65px 65px 65px;
            gap: 20px; /* O ESPAÇAMENTO PARA NÃO ERRAR O TOQUE */
            justify-content: center;
            align-items: center;
        }
        
        .d-btn {
            width: 100%; height: 100%; border-radius: 18px;
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
            border: 2px solid #475569; color: #f8fafc; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.1);
            cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%); border-color: #86efac;
            transform: scale(0.9) translateY(4px); box-shadow: 0 2px 5px rgba(0,0,0,0.5); color: #000;
        }
        .d-btn .material-icons-round { font-size: 40px; }
        
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        /* TELAS OVERLAY */
        .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        h1 { font-family: 'Orbitron'; font-size: 42px; font-weight: 900; margin-bottom: 10px; letter-spacing: 2px; }
        .main-btn { background: var(--primary); border: none; color: #000; padding: 18px 45px; font-family: 'Orbitron'; font-weight: 900; font-size: 18px; border-radius: 30px; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4); margin-top: 20px; }
        .main-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header id="hud">
        <div class="hud-stat" style="color: var(--accent);">
            <span class="stat-label">Fase</span>
            <span class="stat-value" id="ui-level">1</span>
        </div>
        
        <div class="progress-container">
            <span class="stat-label" style="color: #fff;"><span id="ui-score">0</span> / <span id="ui-target">100</span> Presas</span>
            <div class="progress-bar"><div class="progress-fill" id="ui-progress"></div></div>
        </div>

        <div class="hud-stat" style="color: var(--primary);">
            <span class="stat-label">Tamanho</span>
            <span class="stat-value" id="ui-size">1</span>
        </div>
    </header>

    <main id="game-area">
        <canvas id="canvas"></canvas>
        
        <div id="start-screen" class="overlay">
            <h1 style="color: var(--primary); text-shadow: 0 0 20px var(--primary);">PREDATOR 3D</h1>
            <p style="color: #94a3b8; margin-bottom: 20px; max-width: 300px;">8 Fases de Sobrevivência Extrema. Evolua, proteja o seu ninho e escape das águias.</p>
            <button class="main-btn" onclick="startGame()">INICIAR CAÇADA</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h1 id="end-title" style="color: var(--danger);">MORTO</h1>
            <p id="end-desc" style="color: #fff; margin-bottom: 20px;"></p>
            <button class="main-btn" onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>
    </main>

    <footer id="controls-wrapper">
        <div id="d-pad">
            <div class="d-btn btn-up" onpointerdown="changeDir(0, -1)"><span class="material-icons-round">keyboard_arrow_up</span></div>
            <div class="d-btn btn-left" onpointerdown="changeDir(-1, 0)"><span class="material-icons-round">keyboard_arrow_left</span></div>
            <div class="d-btn btn-right" onpointerdown="changeDir(1, 0)"><span class="material-icons-round">keyboard_arrow_right</span></div>
            <div class="d-btn btn-down" onpointerdown="changeDir(0, 1)"><span class="material-icons-round">keyboard_arrow_down</span></div>
        </div>
    </footer>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('game-area');

    // === CONFIGURAÇÕES E ESTADO ===
    const cols = 28; 
    const rows = 28;
    let cellW, cellH;
    
    let state = {
        running: false,
        level: 1, score: 0, targetScore: 100,
        speed: 6 // Ticks por segundo
    };

   // Parâmetros das 8 Fases (Meta reduzida para balanceamento)
    const levelsData = [
        { target: 100, rocks: 0, trees: 0, movingPrey: false, eagles: 0, nest: false, babies: 0, bg: '#1e293b', snakeColor: '#4ade80' }, // Fase 1
        { target: 200, rocks: 5, trees: 0, movingPrey: false, eagles: 0, nest: false, babies: 0, bg: '#451a03', snakeColor: '#facc15' }, // Fase 2
        { target: 300, rocks: 8, trees: 5, movingPrey: false, eagles: 0, nest: false, babies: 0, bg: '#14532d', snakeColor: '#22d3ee' }, // Fase 3
        { target: 400, rocks: 10, trees: 8, movingPrey: true, eagles: 0, nest: false, babies: 0, bg: '#312e81', snakeColor: '#c084fc' }, // Fase 4
        { target: 500, rocks: 12, trees: 10, movingPrey: true, eagles: 1, nest: false, babies: 0, bg: '#701a75', snakeColor: '#f87171' }, // Fase 5
        { target: 600, rocks: 15, trees: 5, movingPrey: true, eagles: 1, nest: true, babies: 0, bg: '#064e3b', snakeColor: '#fbbf24' }, // Fase 6
        { target: 800, rocks: 10, trees: 5, movingPrey: true, eagles: 2, nest: true, babies: 20, bg: '#4c1d95', snakeColor: '#34d399' }, // Fase 7
        { target: 900, rocks: 15, trees: 8, movingPrey: true, eagles: 3, nest: true, babies: 20, portal: true, bg: '#000000', snakeColor: '#e879f9' } // Fase 8
    ];

    let snake = { body: [], dir: {x:1, y:0}, nextDir: {x:1, y:0}, color: '#4ade80' };
    let preys = [];
    let obstacles = [];
    let eagles = [];
    let nest = { active: false, x: Math.floor(cols/2), y: Math.floor(rows/2), eggs: 0, babies: 0 };
    let groundPredators = [];
    let portal = { active: false, x: 0, y: 0 };

    function resize() {
        canvas.width = gameArea.clientWidth;
        canvas.height = gameArea.clientHeight;
        cellW = canvas.width / cols;
        cellH = canvas.height / rows;
    }
    window.addEventListener('resize', resize);
    resize();

    // === INICIALIZAÇÃO ===
    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        loadLevel(1);
        state.running = true;
        gameLoop();
    }

    function loadLevel(lvl) {
        state.level = lvl;
        let lData = levelsData[lvl - 1];
        state.targetScore = lData.target;
        gameArea.style.background = lData.bg;
        snake.color = lData.snakeColor;
        state.speed = 6 + (lvl * 0.5); // Fica ligeiramente mais rápido

        // Reseta Cobra
        snake.body = [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }];
        snake.dir = {x:1, y:0}; snake.nextDir = {x:1, y:0};
        
        // Reseta Entidades
        obstacles = []; preys = []; eagles = []; groundPredators = [];
        portal.active = false;
        
        // Ninho
        nest.active = lData.nest;
        nest.eggs = (lvl === 6) ? 5 : 0;
        nest.babies = lData.babies;

        // Gera Obstáculos (Pedras e Árvores)
        for(let i=0; i<lData.rocks; i++) spawnObstacle('rock');
        for(let i=0; i<lData.trees; i++) spawnObstacle('tree');

        // Gera Águias
        for(let i=0; i<lData.eagles; i++) eagles.push({ state: 'cooldown', timer: 100 + Math.random()*100, x:-1, y:-1 });

        maintainPreys();
        updateHUD();
    }

    function spawnObstacle(type) {
        let x, y, valid;
        do {
            valid = true;
            x = Math.floor(Math.random() * cols); y = Math.floor(Math.random() * rows);
            if (x < 10 && y < 10) valid = false; // Longe do spawn da cobra
            if (nest.active && Math.abs(x - nest.x) < 3 && Math.abs(y - nest.y) < 3) valid = false; // Longe do ninho
        } while(!valid);
        obstacles.push({x, y, type});
    }

    function maintainPreys() {
        let requiredPreys = 15 + state.level * 2; // Começa com ~17, sobe pra ~30 presas na tela
        while(preys.length < requiredPreys) {
            let px = Math.floor(Math.random() * cols);
            let py = Math.floor(Math.random() * rows);
            preys.push({ x: px, y: py });
        }
    }

    // === CONTROLES ===
    function changeDir(x, y) {
        if (x !== 0 && snake.dir.x !== 0) return;
        if (y !== 0 && snake.dir.y !== 0) return;
        snake.nextDir = { x, y };
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') changeDir(0, -1);
        if (e.key === 'ArrowDown') changeDir(0, 1);
        if (e.key === 'ArrowLeft') changeDir(-1, 0);
        if (e.key === 'ArrowRight') changeDir(1, 0);
    });

    // === LOOP E LÓGICA PRINCIPAL ===
    let lastTime = 0; let accumulatedTime = 0;
    
    function gameLoop(timestamp = 0) {
        if (!state.running) return;
        let deltaTime = timestamp - lastTime;
        lastTime = timestamp; accumulatedTime += deltaTime;
        
        let tickInterval = 1000 / state.speed; 
        if (accumulatedTime > tickInterval) { update(); accumulatedTime = 0; }
        
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        snake.dir = { ...snake.nextDir };
        let head = { x: snake.body[0].x + snake.dir.x, y: snake.body[0].y + snake.dir.y };

        // Wrap Around (Tela Infinita)
        if (head.x < 0) head.x = cols - 1; if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows - 1; if (head.y >= rows) head.y = 0;

        // Colisão com o Corpo
        for (let i = 1; i < snake.body.length; i++) {
            if (head.x === snake.body[i].x && head.y === snake.body[i].y) return gameOver("AUTO-MORDIDA", "Você enrolou-se no próprio corpo!");
        }

        // Colisão / Empurrar Obstáculos
        for (let i = 0; i < obstacles.length; i++) {
            let o = obstacles[i];
            if (head.x === o.x && head.y === o.y) {
                if (state.level >= 6 && o.type === 'rock') {
                    // Tenta empurrar a pedra
                    let pushX = o.x + snake.dir.x; let pushY = o.y + snake.dir.y;
                    if (pushX < 0) pushX = cols - 1; if (pushX >= cols) pushX = 0;
                    if (pushY < 0) pushY = rows - 1; if (pushY >= rows) pushY = 0;
                    
                    // Verifica se o espaço atrás da pedra está livre
                    let blocked = obstacles.some(ob => ob.x === pushX && ob.y === pushY) || (nest.active && pushX===nest.x && pushY===nest.y);
                    if (!blocked) { o.x = pushX; o.y = pushY; } 
                    else { return gameOver("ESMAGADO", "Bateu numa barricada imóvel!"); }
                } else {
                    return gameOver("COLISÃO CRÍTICA", "Você bateu numa árvore ou rocha sólida.");
                }
            }
        }

        snake.body.unshift(head);
        let ate = false;

        // Comer Presa
        for (let i = 0; i < preys.length; i++) {
            if (head.x === preys[i].x && head.y === preys[i].y) {
                preys.splice(i, 1);
                state.score++;
                ate = true;
                break;
            }
        }

        // Comer Predador Terrestre
        for (let i = 0; i < groundPredators.length; i++) {
            if (head.x === groundPredators[i].x && head.y === groundPredators[i].y) {
                groundPredators.splice(i, 1);
                state.score += 5; ate = true; break;
            }
        }

        if (!ate) {
            snake.body.pop(); // Crescimento perfeito: 1 Presa = 1 Segmento
        }

        updateHUD();
        checkLevelUp();
        
        // --- IA DOS INIMIGOS ---
        let lData = levelsData[state.level - 1];

        // 1. Presas Movendo-se (Fugindo)
        if (lData.movingPrey && Math.random() > 0.6) {
            preys.forEach(p => {
                if (Math.abs(p.x - head.x) < 5 && Math.abs(p.y - head.y) < 5) {
                    p.x += (p.x > head.x ? 1 : -1); p.y += (p.y > head.y ? 1 : -1);
                    if (p.x < 0) p.x = cols-1; if (p.x >= cols) p.x = 0;
                    if (p.y < 0) p.y = rows-1; if (p.y >= rows) p.y = 0;
                }
            });
        }

        // 2. Spawn Predadores do Ninho (Fase 6+)
        if (nest.active && (nest.eggs > 0 || nest.babies > 0)) {
            if (Math.random() < 0.05 + (state.level * 0.01)) { // 5-10% chance por tick
                let edgeX = Math.random() > 0.5 ? 0 : cols-1;
                let edgeY = Math.random() > 0.5 ? 0 : rows-1;
                groundPredators.push({x: edgeX, y: edgeY});
            }
            
            // Move Predadores em direção ao ninho
            if(Math.random() > 0.3) {
                groundPredators.forEach(gp => {
                    let dx = nest.x - gp.x; let dy = nest.y - gp.y;
                    if(Math.abs(dx) > Math.abs(dy)) gp.x += (dx > 0 ? 1 : -1);
                    else gp.y += (dy > 0 ? 1 : -1);

                    // Verifica se devorou ovo/bebe
                    if(gp.x === nest.x && gp.y === nest.y) {
                        if(nest.babies > 0) nest.babies--; else nest.eggs--;
                        gp.x = -10; // some
                        if(nest.eggs === 0 && nest.babies === 0) return gameOver("NINHO DESTRUÍDO", "Os predadores devoraram toda a sua ninhada!");
                    }
                });
            }
            groundPredators = groundPredators.filter(gp => gp.x >= 0); // Limpa os que comeram
        }

        // 3. Águias (Fase 5+)
        eagles.forEach(e => {
            if (e.state === 'cooldown') {
                e.timer--;
                if(e.timer <= 0) {
                    e.state = 'aiming'; e.timer = 20; // 20 ticks mirando
                    // Mira num local à frente da cobra para prever movimento
                    e.x = head.x + snake.dir.x * 2; e.y = head.y + snake.dir.y * 2;
                    if(e.x >= cols) e.x -= cols; if(e.x < 0) e.x += cols;
                    if(e.y >= rows) e.y -= rows; if(e.y < 0) e.y += rows;
                }
            } else if (e.state === 'aiming') {
                e.timer--;
                if(e.timer <= 0) { e.state = 'striking'; e.timer = 5; } // Strike rápido
            } else if (e.state === 'striking') {
                // Checa Colisão
                if (head.x === e.x && head.y === e.y) return gameOver("ATAQUE AÉREO", "A Águia devorou a sua cabeça!");
                
                // Corta o rabo na fase 7 e 8
                if(state.level >= 7) {
                    for(let i=1; i<snake.body.length; i++) {
                        if(snake.body[i].x === e.x && snake.body[i].y === e.y) {
                            snake.body = snake.body.slice(0, i); // Corta o corpo
                            if(snake.body.length < 3) return gameOver("DESMEMBRADO", "A Águia cortou o seu corpo até não sobrar nada!");
                            break;
                        }
                    }
                }
                e.timer--;
                if(e.timer <= 0) { e.state = 'cooldown'; e.timer = 80; }
            }
        });

        // 4. Portal da Vitória (Fase 8)
        if (state.level === 8 && state.score >= 1000 && !portal.active) {
            portal.active = true;
            portal.x = 2; portal.y = 2; // Canto
        }

        if (portal.active && head.x === portal.x && head.y === portal.y) {
            winGame();
        }

        maintainPreys();
    }

    function checkLevelUp() {
        if (state.score >= state.targetScore && state.level < 8) {
            // XP PRO CHAT PTT
            if(window.parent && window.parent.gameLevelUp) window.parent.gameLevelUp(state.level);
            loadLevel(state.level + 1);
        }
    }

    // === RENDERIZAÇÃO 3D (CANVAS API) ===
    function draw3DSphere(px, py, radius, color, highlightOffset = -2) {
        let grad = ctx.createRadialGradient(px + highlightOffset, py + highlightOffset, radius*0.2, px, py, radius);
        grad.addColorStop(0, '#ffffff'); // Brilho Especular (3D)
        grad.addColorStop(0.3, color);
        grad.addColorStop(1, '#000000'); // Sombra
        ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI*2);
        ctx.fillStyle = grad; ctx.fill();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Ninho e Portal (Chão)
        if (nest.active) {
            ctx.fillStyle = 'rgba(139, 69, 19, 0.4)';
            ctx.beginPath(); ctx.arc(nest.x*cellW + cellW/2, nest.y*cellH + cellH/2, cellW*1.5, 0, Math.PI*2); ctx.fill();
            let count = nest.eggs > 0 ? nest.eggs : nest.babies;
            let color = nest.eggs > 0 ? '#f8fafc' : snake.color;
            for(let i=0; i<count; i++) {
                let ox = nest.x*cellW + cellW/2 + Math.cos(i) * 10;
                let oy = nest.y*cellH + cellH/2 + Math.sin(i) * 10;
                draw3DSphere(ox, oy, cellW*0.25, color);
            }
        }

        if (portal.active) {
            let pulse = Math.abs(Math.sin(Date.now() / 200)) * 5;
            let grad = ctx.createRadialGradient(portal.x*cellW+cellW/2, portal.y*cellH+cellH/2, pulse, portal.x*cellW+cellW/2, portal.y*cellH+cellH/2, cellW*2);
            grad.addColorStop(0, '#fff'); grad.addColorStop(0.5, '#c084fc'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(portal.x*cellW+cellW/2, portal.y*cellH+cellH/2, cellW*2, 0, Math.PI*2); ctx.fill();
        }

        // 2. Obstáculos (Pedras e Árvores)
        obstacles.forEach(o => {
            let px = o.x * cellW + cellW/2; let py = o.y * cellH + cellH/2;
            if(o.type === 'rock') draw3DSphere(px, py, cellW*0.45, '#64748b');
            if(o.type === 'tree') {
                ctx.fillStyle = '#451a03'; ctx.fillRect(px - cellW*0.1, py, cellW*0.2, cellH*0.4); 
                draw3DSphere(px, py - cellH*0.2, cellW*0.5, '#15803d'); 
            }
        });

        // 3. Presas (Agora são SAPOS CARTOON)
        preys.forEach(p => {
            let px = p.x * cellW + cellW/2; let py = p.y * cellH + cellH/2;
            let r = cellW*0.35;
            
            // Perninhas do sapo
            ctx.fillStyle = '#4d7c0f';
            ctx.beginPath(); ctx.arc(px - r, py + r*0.4, r*0.4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + r, py + r*0.4, r*0.4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px - r, py - r*0.4, r*0.3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + r, py - r*0.4, r*0.3, 0, Math.PI*2); ctx.fill();
            
            // Corpo do sapo
            draw3DSphere(px, py, r, '#84cc16'); 
            
            // Olhos do sapo
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(px - r*0.4, py - r*0.5, r*0.35, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + r*0.4, py - r*0.5, r*0.35, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(px - r*0.4, py - r*0.6, r*0.15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(px + r*0.4, py - r*0.6, r*0.15, 0, Math.PI*2); ctx.fill();
        });

        // Predadores Terrestres (Inimigos do Ninho)
        groundPredators.forEach(gp => {
            let px = gp.x * cellW + cellW/2; let py = gp.y * cellH + cellH/2;
            draw3DSphere(px, py, cellW*0.4, '#dc2626'); 
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(px-4, py-2, 3, 3); ctx.fillRect(px+1, py-2, 3, 3);
        });

        // 4. A COBRA (Corpo unificado tubular e cauda mais grossa)
        for (let i = snake.body.length - 1; i >= 0; i--) {
            let seg = snake.body[i];
            let px = seg.x * cellW + cellW/2; 
            let py = seg.y * cellH + cellH/2;
            
            // Corpo mais uniforme, cauda levemente afinada mas não "fina"
            let radius = (cellW / 2) * (i === 0 ? 0.95 : 0.90); 
            if (i >= snake.body.length - 3 && i !== 0) radius *= 0.85; // Cauda mais grossa que antes
            
            // INTERPOLAÇÃO 3D (A Mágica para não parecerem bolinhas separadas)
            if (i > 0) {
                let nextSeg = snake.body[i-1];
                let nx = nextSeg.x * cellW + cellW/2;
                let ny = nextSeg.y * cellH + cellH/2;
                
                // Só une se a distância for de 1 bloco (para não criar uma linha quando atravessa a tela infinita)
                if (Math.abs(seg.x - nextSeg.x) <= 1 && Math.abs(seg.y - nextSeg.y) <= 1) {
                    // Preenche o espaço entre os segmentos com 3 mini-esferas para "soldar" o tubo
                    for(let j = 1; j <= 3; j++) {
                        let interpX = px + (nx - px) * (j/4);
                        let interpY = py + (ny - py) * (j/4);
                        draw3DSphere(interpX, interpY, radius, snake.color);
                    }
                }
            }

            // Base do corpo 3D (Articulação principal)
            draw3DSphere(px, py, radius, snake.color);

            // Listras (Zig-Zag) no corpo
            if (i > 0 && i < snake.body.length - 1) {
                if (i % 2 === 0) { 
                    ctx.strokeStyle = 'rgba(250, 204, 21, 0.9)'; 
                    ctx.lineWidth = radius * 0.4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(px - radius*0.6, py - radius*0.6);
                    ctx.lineTo(px + radius*0.6, py + radius*0.6);
                    ctx.stroke();
                }
            }

            // Cabeça Detalhada
            if (i === 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath(); ctx.arc(px, py, radius*0.7, 0, Math.PI*2); ctx.fill();

                let eyeOffsetX = snake.dir.x * radius * 0.3;
                let eyeOffsetY = snake.dir.y * radius * 0.3;
                let perpX = -snake.dir.y * radius * 0.5;
                let perpY = snake.dir.x * radius * 0.5;
                
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(px + eyeOffsetX + perpX, py + eyeOffsetY + perpY, radius*0.45, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + eyeOffsetX - perpX, py + eyeOffsetY - perpY, radius*0.45, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(px + eyeOffsetX*1.5 + perpX, py + eyeOffsetY*1.5 + perpY, radius*0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + eyeOffsetX*1.5 - perpX, py + eyeOffsetY*1.5 - perpY, radius*0.2, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(px + eyeOffsetX*1.5 + perpX - 1.5, py + eyeOffsetY*1.5 + perpY - 1.5, radius*0.05, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + eyeOffsetX*1.5 - perpX - 1.5, py + eyeOffsetY*1.5 - perpY - 1.5, radius*0.05, 0, Math.PI*2); ctx.fill();
            }
        }

        // 5. Águias
        eagles.forEach(e => {
            let px = e.x * cellW + cellW/2; let py = e.y * cellH + cellH/2;
            if (e.state === 'aiming') {
                ctx.strokeStyle = `rgba(239, 68, 68, ${e.timer/20})`; 
                ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, cellW*1.5, 0, Math.PI*2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px-cellW*2, py); ctx.lineTo(px+cellW*2, py); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(px, py-cellH*2); ctx.lineTo(px, py+cellH*2); ctx.stroke();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.ellipse(px + (e.timer*5), py - (e.timer*5), cellW*3, cellH, Math.PI/4, 0, Math.PI*2); ctx.fill();
            } else if (e.state === 'striking') {
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath(); ctx.moveTo(px-10, py-20); ctx.lineTo(px, py); ctx.lineTo(px+10, py-20); ctx.fill();
                draw3DSphere(px, py-10, cellW*0.8, '#451a03'); 
            }
        });
    }

    function updateHUD() {
        document.getElementById('ui-level').innerText = state.level;
        document.getElementById('ui-score').innerText = state.score;
        document.getElementById('ui-target').innerText = state.targetScore;
        document.getElementById('ui-size').innerText = snake.body.length;
        
        let pct = (state.score / state.targetScore) * 100;
        document.getElementById('ui-progress').style.width = Math.min(pct, 100) + '%';
    }

    function gameOver(title, desc) {
        state.running = false;
        document.getElementById('end-title').innerText = title;
        document.getElementById('end-title').style.color = 'var(--danger)';
        document.getElementById('end-desc').innerText = desc;
        document.getElementById('end-screen').classList.remove('hidden');
        if(window.parent && window.parent.gameEarnXP) window.parent.gameEarnXP(state.score);
    }

    function winGame() {
        state.running = false;
        document.getElementById('end-title').innerText = "TRANSCENDÊNCIA!";
        document.getElementById('end-title').style.color = '#c084fc';
        document.getElementById('end-desc').innerText = "Você guiou sua linhagem para o Portal da Vida Eterna. Lenda Imortal.";
        document.querySelector('#end-screen .main-btn').innerText = "JOGAR NOVAMENTE";
        document.getElementById('end-screen').classList.remove('hidden');
        if(window.parent && window.parent.gameEarnXP) window.parent.gameEarnXP(2000); // Bônus Zerei o Jogo
    }

</script>
