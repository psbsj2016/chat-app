<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predator 6D: Dimensional Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* =========================================
           ARQUITETURA UI / UX
           ========================================= */
        :root {
            --bg-color: #05050A;
            --hud-bg: rgba(15, 23, 42, 0.9);
            --primary: #06B6D4;
            --accent: #8B5CF6;
            --danger: #EF4444;
            --success: #22C55E;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { background-color: var(--bg-color); font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* 1. HEADER / HUD SUPERIOR */
        #hud {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--hud-bg); padding: 10px 15px; border-bottom: 2px solid rgba(255,255,255,0.1);
            color: #fff; z-index: 10; backdrop-filter: blur(10px);
            height: 70px; flex-shrink: 0;
        }
        .hud-center { display: flex; gap: 15px; align-items: center; }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 9px; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 16px; font-weight: 900; color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .icon-btn { background: transparent; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }

        /* 2. ÁREA DO JOGO (DISPLAY INFINITO) */
        #game-area {
            flex: 1; position: relative; width: 100%; overflow: hidden;
            background: radial-gradient(circle at center, #111827 0%, #000000 100%);
            transition: filter 1s ease; /* Efeito Transição de Dimensão */
        }
        canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }

        /* 3. CONTROLOS INFERIORES (D-PAD) */
        #controls-wrapper {
            height: 180px; background: var(--hud-bg); border-top: 2px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            padding-bottom: 10px;
        }
        
        #d-pad {
            position: relative; width: 150px; height: 150px;
        }
        .d-btn {
            position: absolute; width: 50px; height: 50px; border-radius: 12px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.1s; cursor: pointer;
        }
        .d-btn:active { background: rgba(6, 182, 212, 0.3); transform: scale(0.9); border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }
        
        .btn-up { top: 0; left: 50px; }
        .btn-down { bottom: 0; left: 50px; }
        .btn-left { top: 50px; left: 0; }
        .btn-right { top: 50px; right: 0; }

        /* TELAS DE UI (OVERLAYS) */
        .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .hidden { display: none !important; }
        .cyber-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 15px 40px; font-family: 'Orbitron'; font-weight: 900; font-size: 16px; margin: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .cyber-btn:hover, .cyber-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
    </style>
</head>
<body>

    <header id="hud">
        <button class="icon-btn" onclick="goBack()"><span class="material-icons-round" style="font-size: 28px;">arrow_back</span></button>
        
        <div class="hud-center">
            <div class="hud-stat"><span class="stat-label">Presas</span><span class="stat-value" id="ui-score">0</span></div>
            <div class="hud-stat"><span class="stat-label">Nível</span><span class="stat-value" id="ui-level" style="color: var(--accent); text-shadow: 0 0 10px var(--accent);">1</span></div>
            <div class="hud-stat"><span class="stat-label">Vel.</span><span class="stat-value" id="ui-speed">1.0x</span></div>
            <div class="hud-stat"><span class="stat-label">Modo</span><span class="stat-value" id="ui-mode" style="font-size: 12px; margin-top:3px; color: #fff; text-shadow: none;">SOLO</span></div>
        </div>

        <button class="icon-btn"><span class="material-icons-round" style="font-size: 28px;">menu</span></button>
    </header>

    <main id="game-area">
        <canvas id="canvas"></canvas>
        
        <div id="start-screen" class="overlay">
            <h1 style="color: var(--primary); font-size: 40px; margin-bottom: 5px; text-shadow: 0 0 20px var(--primary);">PREDATOR 6D</h1>
            <p style="color: #94A3B8; margin-bottom: 40px; letter-spacing: 2px;">ALÉM DO ESPAÇO E DO TEMPO</p>
            <button class="cyber-btn" onclick="initGame('solo')">Modo Solo (Offline)</button>
            <button class="cyber-btn" onclick="initGame('multi')" style="border-color: var(--accent); color: var(--accent);">Modo Multiplayer</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h1 id="end-title" style="color: var(--danger); font-size: 40px;">SINAL PERDIDO</h1>
            <p id="end-desc" style="color: #fff; margin-bottom: 30px; font-size: 18px;"></p>
            <button class="cyber-btn" onclick="location.reload()">Reiniciar Loop</button>
        </div>
    </main>

    <footer id="controls-wrapper">
        <div id="d-pad">
            <div class="d-btn btn-up" onpointerdown="changeDir(0, -1)"><span class="material-icons-round">keyboard_arrow_up</span></div>
            <div class="d-btn btn-left" onpointerdown="changeDir(-1, 0)"><span class="material-icons-round">keyboard_arrow_left</span></div>
            <div class="d-btn btn-right" onpointerdown="changeDir(1, 0)"><span class="material-icons-round">keyboard_arrow_right</span></div>
            <div class="d-btn btn-down" onpointerdown="changeDir(0, 1)"><span class="material-icons-round">keyboard_arrow_down</span></div>
        </div>
    </footer>

<script>
    const socket = io();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('game-area');

    // === MÁQUINA DE ESTADOS E MULTIPLAYER ===
    let state = {
        isRunning: false, mode: 'solo',
        score: 0, level: 1, maxLevel: 10,
        baseSpeed: 5, currentSpeed: 5,
        dimension: 1 
    };

    // Grade Lógica Fixa (Garante que o ecrã do telemóvel e do PC sincronizem os corpos perfeitamente)
    const cols = 30; 
    const rows = 30;
    let cellW, cellH;
    
    let snake = {
        body: [],
        dir: { x: 1, y: 0 },
        nextDir: { x: 1, y: 0 },
        colorHead: '#06B6D4', colorBody: '#0891B2'
    };

    // Oponente (Invasor Dimensional)
    let currentRoom = null;
    let opponent = {
        active: false,
        id: null,
        body: [],
        colorHead: '#EF4444', 
        colorBody: '#7F1D1D'
    };

    let prey = { x: 0, y: 0, type: 'normal', color: '#FDE047' };

    const dimensions = [
        { filter: 'hue-rotate(0deg)', bg: '#000', head: '#06B6D4' },
        { filter: 'hue-rotate(90deg)', bg: '#0A0500', head: '#22C55E' },
        { filter: 'hue-rotate(180deg)', bg: '#05000A', head: '#EF4444' },
        { filter: 'hue-rotate(270deg)', bg: '#000A0A', head: '#A855F7' }
    ];

    function resize() {
        canvas.width = gameArea.clientWidth;
        canvas.height = gameArea.clientHeight;
        cellW = canvas.width / cols;
        cellH = canvas.height / rows;
    }
    window.addEventListener('resize', resize);
    resize();

    // === NÚCLEO DO JOGO ===
    function initGame(mode) {
        state.mode = mode;
        document.getElementById('ui-mode').innerText = mode.toUpperCase();
        document.getElementById('start-screen').classList.add('hidden');
        
        if (mode === 'multi') {
            document.getElementById('end-title').innerText = "RASTREANDO...";
            document.getElementById('end-title').style.color = "var(--primary)";
            document.getElementById('end-desc').innerText = "Aguardando um rival cruzar a fenda dimensional...";
            document.getElementById('end-screen').classList.remove('hidden');
            
            // Entra na fila do servidor ChatPTT
            socket.emit('join_snake_duel', { profile: { name: 'Predador 6D' } });
        } else {
            resetSnake(Math.floor(cols/2));
            spawnPrey();
            state.isRunning = true;
            gameLoop();
        }
    }

    // === SINAIS DO MULTIVERSO (SOCKETS) ===
    socket.on('snake_duel_start', (data) => {
        const me = data.players.find(p => p.id === socket.id);
        const them = data.players.find(p => p.id !== socket.id);
        
        currentRoom = data.roomId;
        opponent.id = them.id;
        opponent.active = true;

        document.getElementById('end-screen').classList.add('hidden');

        // Um nasce na esquerda, outro na direita
        const isHost = data.players[0].id === socket.id;
        resetSnake(isHost ? 5 : cols - 5);
        snake.dir = { x: isHost ? 1 : -1, y: 0 };
        snake.nextDir = { x: isHost ? 1 : -1, y: 0 };

        opponent.body = [{ x: isHost ? cols - 5 : 5, y: Math.floor(rows/2) }];

        spawnPrey();
        state.score = 0; state.level = 1; state.baseSpeed = 5;
        updateHUD();

        state.isRunning = true;
        gameLoop();
    });

    socket.on('opponent_move', (data) => {
        if(opponent.active) opponent.body = data.history; // history contém o array do corpo
    });

    socket.on('duel_victory', () => {
        gameOver("VITÓRIA", "O rival foi desintegrado da linha do tempo!", "var(--success)");
    });

    // === MECÂNICAS ===
    function resetSnake(startX) {
        snake.body = [ { x: startX, y: Math.floor(rows/2) } ];
        snake.dir = { x: 1, y: 0 }; snake.nextDir = { x: 1, y: 0 };
    }

    function spawnPrey() {
        prey.x = Math.floor(Math.random() * cols);
        prey.y = Math.floor(Math.random() * rows);
        
        let rand = Math.random();
        if (rand > 0.9) { prey.type = 'time'; prey.color = '#3B82F6'; } 
        else if (rand > 0.8) { prey.type = 'dimension'; prey.color = '#D946EF'; } 
        else { prey.type = 'normal'; prey.color = '#FDE047'; } 
    }

    function changeDir(x, y) {
        if (x !== 0 && snake.dir.x !== 0) return;
        if (y !== 0 && snake.dir.y !== 0) return;
        snake.nextDir = { x, y };
    }

    function handleProgression(pointsGained) {
        state.score += pointsGained;
        let newLevel = Math.floor(state.score / 100) + 1;
        
        if (newLevel > state.level) {
            state.level = newLevel;
            if (state.level > state.maxLevel) return gameOver("TRANSCENDÊNCIA", "Você dominou a 6ª Dimensão!", "#22C55E");

            snake.body = [snake.body[0]]; // Volta a ser pequeno
            state.baseSpeed += 1;
            shiftDimension(); 
            if(window.parent && window.parent.gameLevelUp) window.parent.gameLevelUp(state.level);
        }
        updateHUD();
    }

    function shiftDimension() {
        state.dimension = (state.dimension + 1) % dimensions.length;
        let dim = dimensions[state.dimension];
        gameArea.style.filter = dim.filter;
        snake.colorHead = dim.head;
    }

    function updateHUD() {
        document.getElementById('ui-score').innerText = state.score;
        document.getElementById('ui-level').innerText = state.level;
        document.getElementById('ui-speed').innerText = state.baseSpeed.toFixed(1) + 'x';
    }

    // === UPDATE E RENDER ===
    let lastTime = 0; let accumulatedTime = 0;

    function gameLoop(timestamp = 0) {
        if (!state.isRunning) return;
        let deltaTime = timestamp - lastTime;
        lastTime = timestamp; accumulatedTime += deltaTime;
        
        let tickInterval = 1000 / (state.baseSpeed * 2); 
        if (accumulatedTime > tickInterval) { update(); accumulatedTime = 0; }
        
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        snake.dir = { ...snake.nextDir };
        let head = { x: snake.body[0].x + snake.dir.x, y: snake.body[0].y + snake.dir.y };

        // Wrap Around Infinito
        if (head.x < 0) head.x = cols - 1; if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows - 1; if (head.y >= rows) head.y = 0;

        // Auto-Colisão
        for (let i = 0; i < snake.body.length; i++) {
            if (head.x === snake.body[i].x && head.y === snake.body[i].y) return gameOver("COLAPSO", `Auto-devoração no nível ${state.level}`, "var(--danger)");
        }

        snake.body.unshift(head);

        // Comunicação Multiplayer e Colisão Tática
        if (state.mode === 'multi') {
            socket.emit('snake_move', { roomId: currentRoom, head: head, history: snake.body, angle: 0 });
            
            if (opponent.active) {
                for (let pt of opponent.body) {
                    if (head.x === pt.x && head.y === pt.y) {
                        socket.emit('snake_death', { roomId: currentRoom, opponentId: opponent.id });
                        return gameOver("SINAL PERDIDO", "Você bateu no corpo do Invasor!", "var(--danger)");
                    }
                }
            }
        }

        // Comer Presa
        if (head.x === prey.x && head.y === prey.y) {
            let pts = 10;
            if(prey.type === 'time') { state.baseSpeed -= 1; pts = 20; setTimeout(()=> state.baseSpeed += 1, 5000); }
            if(prey.type === 'dimension') { shiftDimension(); pts = 50; }
            handleProgression(pts); spawnPrey();
        } else {
            snake.body.pop(); 
        }
    }

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Motion Blur
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenha Presa
        let pulse = Math.abs(Math.sin(Date.now() / 200)) * 4;
        ctx.fillStyle = prey.color; ctx.shadowBlur = 15; ctx.shadowColor = prey.color;
        ctx.beginPath();
        ctx.ellipse(prey.x * cellW + cellW/2, prey.y * cellH + cellH/2, (cellW/2 - 2) + pulse/2, (cellH/2 - 2) + pulse/2, 0, 0, Math.PI*2);
        ctx.fill();

        // Desenha Invasor (Multiplayer)
        if (state.mode === 'multi' && opponent.active) {
            opponent.body.forEach((seg, i) => {
                let isHead = i===0;
                ctx.fillStyle = isHead ? opponent.colorHead : opponent.colorBody;
                ctx.shadowBlur = isHead ? 15 : 0; ctx.shadowColor = opponent.colorHead;
                let mX = isHead ? 0 : i * 0.05 * cellW; if(mX > cellW/2-2) mX = cellW/2-2;
                let mY = isHead ? 0 : i * 0.05 * cellH; if(mY > cellH/2-2) mY = cellH/2-2;
                ctx.fillRect(seg.x * cellW + mX, seg.y * cellH + mY, cellW - mX*2, cellH - mY*2);
            });
        }

        // Desenha Minha Cobra
        snake.body.forEach((seg, i) => {
            let isHead = i===0;
            ctx.fillStyle = isHead ? snake.colorHead : snake.colorBody;
            ctx.shadowBlur = isHead ? 10 : 0; ctx.shadowColor = snake.colorHead;
            let mX = isHead ? 0 : i * 0.05 * cellW; if(mX > cellW/2-2) mX = cellW/2-2;
            let mY = isHead ? 0 : i * 0.05 * cellH; if(mY > cellH/2-2) mY = cellH/2-2;
            ctx.fillRect(seg.x * cellW + mX, seg.y * cellH + mY, cellW - mX*2, cellH - mY*2);
        });
        ctx.shadowBlur = 0;
    }

    function gameOver(title, desc, color) {
        state.isRunning = false;
        document.getElementById('end-title').innerText = title;
        document.getElementById('end-title').style.color = color;
        document.getElementById('end-desc').innerText = desc;
        document.getElementById('end-screen').classList.remove('hidden');
        if(window.parent && window.parent.gameEarnXP) window.parent.gameEarnXP(state.score);
    }

    function goBack() {
        if(window.parent && window.parent.closeImmersiveGame) window.parent.closeImmersiveGame();
        else location.reload();
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') changeDir(0, -1);
        if (e.key === 'ArrowDown') changeDir(0, 1);
        if (e.key === 'ArrowLeft') changeDir(-1, 0);
        if (e.key === 'ArrowRight') changeDir(1, 0);
    });
</script>
</body>
</html>
