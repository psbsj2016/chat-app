<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Neon</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        canvas { box-shadow: 0 0 20px rgba(6, 182, 212, 0.5); border-radius: 10px; border: 2px solid #06b6d4; background: #111; }
        .hud { display: flex; justify-content: space-between; width: 300px; margin-bottom: 20px; font-weight: bold; font-size: 18px; }
        .d-pad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 10px; margin-top: 30px; }
        .d-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: white; font-size: 24px; display: flex; justify-content: center; align-items: center; }
        .d-btn:active { background: #06b6d4; }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
        .start-btn { position: absolute; background: #06b6d4; color: black; padding: 15px 30px; font-weight: bold; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

    <div class="hud">
        <span>SCORE: <span id="score" style="color: #06b6d4;">0</span></span>
        <span id="level" style="color: #10b981;">FÁCIL</span>
    </div>

    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <button id="startBtn" class="start-btn" onclick="startGame()">TOCAR PARA JOGAR</button>

    <div class="d-pad">
        <button class="d-btn d-up" ontouchstart="dir('UP')" onmousedown="dir('UP')"><span class="material-icons-round">keyboard_arrow_up</span></button>
        <button class="d-btn d-left" ontouchstart="dir('LEFT')" onmousedown="dir('LEFT')"><span class="material-icons-round">keyboard_arrow_left</span></button>
        <button class="d-btn d-right" ontouchstart="dir('RIGHT')" onmousedown="dir('RIGHT')"><span class="material-icons-round">keyboard_arrow_right</span></button>
        <button class="d-btn d-down" ontouchstart="dir('DOWN')" onmousedown="dir('DOWN')"><span class="material-icons-round">keyboard_arrow_down</span></button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 10;
        let snake, food, dx, dy, score, gameInterval, speed;

        function dir(direction) {
            event.preventDefault();
            if (direction === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
            if (direction === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
            if (direction === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
            if (direction === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
        }

        function startGame() {
            document.getElementById("startBtn").style.display = "none";
            snake = [{x: 150, y: 150}];
            dx = gridSize; dy = 0; score = 0; speed = 120;
            document.getElementById("score").innerText = score;
            placeFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, speed);
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
                y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
            };
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                placeFood();
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snakeCollision(head)) {
                clearInterval(gameInterval);
                document.getElementById("startBtn").style.display = "block";
                document.getElementById("startBtn").innerText = "TENTAR DE NOVO";
                
                // MÁGICA: Comunica com o ChatPTT para dar XP!
                if(score > 0 && window.parent && window.parent.gameEarnXP) {
                    window.parent.gameEarnXP(Math.floor(score / 10)); 
                }
                return;
            }

            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, gridSize, gridSize);

            ctx.fillStyle = "#06b6d4";
            snake.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x + gridSize/2, p.y + gridSize/2, index===0? 5 : 4, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function snakeCollision(head) {
            for (let i = 4; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }
    </script>
</body>
</html>
