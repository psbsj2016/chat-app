<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Serpent: Viper Protocol</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Estilos Cyberpunk Mantidos */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body { background-color: #030308; color: #0FF; font-family: 'Orbitron', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 3, 8, 0.9); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(10px); text-align: center; }
        .hidden { display: none !important; }
        .cyber-btn { background: transparent; border: 2px solid #0FF; color: #0FF; padding: 15px; width: 250px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; margin-bottom: 10px; }
        .cyber-btn:hover { background: rgba(0, 255, 255, 0.1); box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        .primary { background: #0FF; color: #000; }
        .secondary { border-color: #F0F; color: #F0F; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="overlay">
        <h1 style="margin-bottom:20px; font-size: 32px;">Viper Protocol</h1>
        <button class="cyber-btn primary" onclick="initGame('solo')">Protocolo Solo</button>
        <button class="cyber-btn secondary" id="btn-multi" onclick="initGame('multiplayer')">Duelo Online</button>
        <p id="status-msg" style="margin-top:15px; font-size:12px; color:#888;">Selecione o modo</p>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 id="gameResultTitle" style="color: #F00;">Sinal Perdido</h1>
        <p id="finalScoreText">Dados Extraídos: 0</p>
        <button class="cyber-btn primary" onclick="location.reload()">Reiniciar</button>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, isPlaying = false, gameMode = 'solo';
        let currentRoom = null, opponentId = null;

        // Entidades
        const snake = { head: {x:0, y:0}, history: [], angle: 0, length: 20, color: '#0FF', speed: 4 };
        const opponent = { head: {x:0, y:0}, history: [], angle: 0, color: '#F0F', active: false };
        let pointer = { x: 0, y: 0 };

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });

        function initGame(mode) {
            gameMode = mode;
            if(mode === 'solo') {
                startGame();
            } else {
                document.getElementById('status-msg').innerText = "A procurar oponente no radar...";
                document.getElementById('btn-multi').disabled = true;
                // Envia o perfil para o servidor
                socket.emit('join_snake_duel', { profile: { name: 'Agente' } });
            }
        }

        socket.on('snake_duel_start', (data) => {
            const me = data.players.find(p => p.id === socket.id);
            const them = data.players.find(p => p.id !== socket.id);
            
            currentRoom = data.roomId;
            opponentId = them.id;
            
            // Configura posições iniciais do duelo
            snake.head = {...me.startPos};
            snake.color = me.color;
            opponent.head = {...them.startPos};
            opponent.color = them.color;
            opponent.active = true;

            startGame();
        });

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            isPlaying = true;
            if(gameMode === 'solo') snake.head = {x: width/2, y: height/2};
            requestAnimationFrame(gameLoop);
        }

        socket.on('opponent_move', (data) => {
            opponent.head = data.head;
            opponent.history = data.history;
            opponent.angle = data.angle;
        });

        socket.on('duel_victory', () => {
            endGame("VITÓRIA: ALVO ELIMINADO", "#0FF");
        });

        function gameLoop() {
            if(!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            // Movimento fluido em direção ao toque
            let dx = pointer.x - snake.head.x;
            let dy = pointer.y - snake.head.y;
            let targetAngle = Math.atan2(dy, dx);
            let diff = targetAngle - snake.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            snake.angle += diff * 0.1;

            snake.head.x += Math.cos(snake.angle) * snake.speed;
            snake.head.y += Math.sin(snake.angle) * snake.speed;

            // Histórico para o rastro
            snake.history.unshift({...snake.head});
            if(snake.history.length > 100) snake.history.pop();

            // Sincroniza com o servidor se for multiplayer
            if(gameMode === 'multiplayer') {
                socket.emit('snake_move', {
                    roomId: currentRoom,
                    head: snake.head,
                    history: snake.history.slice(0, 20), // Envia apenas pedaço pro rastro ser leve
                    angle: snake.angle
                });

                // Detecção de Colisão Online (Se tocar no rastro do inimigo)
                opponent.history.forEach(pos => {
                    if(Math.hypot(snake.head.x - pos.x, snake.head.y - pos.y) < 10) {
                        socket.emit('snake_death', { roomId: currentRoom, opponentId: opponentId });
                        endGame("DERROTA: LINK CORROMPIDO", "#F00");
                    }
                });
            }

            // Colisão com bordas
            if(snake.head.x < 0 || snake.head.x > width || snake.head.y < 0 || snake.head.y > height) {
                if(gameMode === 'multiplayer') socket.emit('snake_death', { roomId: currentRoom, opponentId: opponentId });
                endGame("SINAL PERDIDO", "#F00");
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Desenha Inimigo
            if(opponent.active) {
                ctx.strokeStyle = opponent.color;
                ctx.lineWidth = 15;
                ctx.beginPath();
                opponent.history.forEach((p, i) => { if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                ctx.stroke();
            }

            // Desenha Minha Cobra
            ctx.strokeStyle = snake.color;
            ctx.lineWidth = 15;
            ctx.shadowBlur = 15;
            ctx.shadowColor = snake.color;
            ctx.beginPath();
            snake.history.forEach((p, i) => { if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
        }

        function endGame(title, color) {
            isPlaying = false;
            document.getElementById('gameResultTitle').innerText = title;
            document.getElementById('gameResultTitle').style.color = color;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
