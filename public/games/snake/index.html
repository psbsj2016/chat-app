<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Predator: Wild Hunt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* =========================================
           ARQUITETURA UI / UX - NATURAL / ORGÂNICO
           ========================================= */
        :root {
            --bg-color: #0c120c;
            --hud-bg: #1a241a;
            --primary: #4ade80;
            --accent: #facc15;
            --danger: #ef4444;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* 1. HEADER / HUD SUPERIOR (LIMPO - SEM SETAS EXTRAS) */
        #hud {
            display: flex; justify-content: center; align-items: center;
            background: var(--hud-bg); padding: 12px 15px; border-bottom: 2px solid #273527;
            color: var(--text-main); z-index: 10;
            height: 70px; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-center { display: flex; gap: 30px; align-items: center; }
        .hud-stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .stat-value { font-size: 18px; font-weight: 900; color: var(--primary); }

        /* 2. ÁREA DO JOGO (CENÁRIOS FOTOREALISTAS) */
        #game-area {
            flex: 1; position: relative; width: 100%; overflow: hidden;
            background-color: #1a2421;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out; /* Transição suave entre níveis */
        }
        canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); }

        /* 3. CONTROLOS INFERIORES (D-PAD ESPAÇOSO) */
        #controls-wrapper {
            height: 250px; background: var(--hud-bg); border-top: 2px solid #273527;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
            padding-bottom: 20px;
        }
        
        #d-pad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 20px; /* ESPAÇO AMPLO ENTRE BOTÕES */
            justify-content: center;
            align-items: center;
        }
        
        .d-btn {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(180deg, #374151 0%, #1e293b 100%);
            border: 2px solid #475569;
            color: #f1f5f9; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
            transition: 0.1s; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active { background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); border-color: #86efac; transform: scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.5); color: #000; }
        .d-btn .material-icons-round { font-size: 38px; font-weight: bold; }
        
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        /* TELAS DE UI */
        .overlay { position: absolute; inset: 0; background: rgba(12, 18, 12, 0.9); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; backdrop-filter: blur(10px); }
        .hidden { display: none !important; }
        .main-btn { background: var(--primary); border: none; color: #000; padding: 18px 45px; font-family: 'Inter', sans-serif; font-weight: 900; font-size: 16px; margin: 10px; border-radius: 30px; cursor: pointer; transition: 0.2s; text-transform: uppercase; box-shadow: 0 8px 20px rgba(74, 222, 128, 0.3); }
        .main-btn:active { transform: scale(0.95); box-shadow: 0 4px 10px rgba(74, 222, 128, 0.3); }
        .secondary-btn { background: transparent; border: 2px solid var(--accent); color: var(--accent); box-shadow: none; }
        .secondary-btn:active { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <header id="hud">
        <div class="hud-center">
            <div class="hud-stat"><span class="stat-label">Comprimento</span><span class="stat-value" id="ui-size" style="color: #fff;">3</span></div>
            <div class="hud-stat"><span class="stat-label">Nível</span><span class="stat-value" id="ui-level" style="color: var(--accent);">1</span></div>
            <div class="hud-stat"><span class="stat-label">Presas</span><span class="stat-value" id="ui-score">0</span></div>
        </div>
    </header>

    <main id="game-area">
        <canvas id="canvas"></canvas>
        
        <div id="start-screen" class="overlay">
            <h1 style="color: var(--primary); font-size: 42px; font-weight: 900; margin-bottom: 10px; letter-spacing: -1px;">WILD HUNT</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 14px;">A NATUREZA NÃO PERDOA.</p>
            <button class="main-btn" onclick="initGame('solo')">Caçada Natural</button>
            <button class="main-btn secondary-btn" onclick="initGame('multi')">Disputar Território</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <h1 id="end-title" style="color: var(--danger); font-size: 38px; font-weight: 900;">FIM DA LINHA</h1>
            <p id="end-desc" style="color: #fff; margin-bottom: 30px; font-size: 16px;"></p>
            <button class="main-btn" onclick="location.reload()">Renascer</button>
        </div>
    </main>

    <footer id="controls-wrapper">
        <div id="d-pad">
            <div class="d-btn btn-up" onpointerdown="changeDir(0, -1)"><span class="material-icons-round">keyboard_arrow_up</span></div>
            <div class="d-btn btn-left" onpointerdown="changeDir(-1, 0)"><span class="material-icons-round">keyboard_arrow_left</span></div>
            <div class="d-btn btn-right" onpointerdown="changeDir(1, 0)"><span class="material-icons-round">keyboard_arrow_right</span></div>
            <div class="d-btn btn-down" onpointerdown="changeDir(0, 1)"><span class="material-icons-round">keyboard_arrow_down</span></div>
        </div>
    </footer>

<script>
    const socket = io();
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gameArea = document.getElementById('game-area');

    let state = { isRunning: false, mode: 'solo', score: 0, level: 1, maxLevel: 10, baseSpeed: 4.5 };

    const cols = 22; 
    const rows = 22;
    let cellW, cellH;
    
    // Cores Orgânicas da Cobra
    let snake = { 
        body: [], dir: { x: 1, y: 0 }, nextDir: { x: 1, y: 0 }, 
        colorSpine: '#064e3b',   // Verde muito escuro (manchas nas costas)
        colorBody: '#15803d',    // Verde floresta (corpo principal)
        colorBelly: '#84cc16'    // Verde limão/amarelado (barriga)
    };
    
    let currentRoom = null;
    let opponent = { 
        active: false, id: null, body: [], 
        colorSpine: '#450a0a', colorBody: '#b91c1c', colorBelly: '#fca5a5' 
    };

    // Cenários Fotorealistas (Imagens da Natureza)
    const backgrounds = [
        "url('https://images.unsplash.com/photo-1558350133-14902b369cc4?auto=format&fit=crop&w=1200&q=80')", // Nível 1: Chão da Floresta
        "url('https://images.unsplash.com/photo-1547333590-bc7490059c25?auto=format&fit=crop&w=1200&q=80')", // Nível 2: Areia do Deserto
        "url('https://images.unsplash.com/photo-1628155930542-3c7a64e2c833?auto=format&fit=crop&w=1200&q=80')", // Nível 3: Pântano
        "url('https://images.unsplash.com/photo-1507369651582-74737a4d56d1?auto=format&fit=crop&w=1200&q=80')", // Nível 4: Folhas de Outono
        "url('https://images.unsplash.com/photo-1464638681273-0962e9b53566?auto=format&fit=crop&w=1200&q=80')", // Nível 5: Rochas / Caverna
        "url('https://images.unsplash.com/photo-1478265409131-1f65c88f965c?auto=format&fit=crop&w=1200&q=80')"  // Nível 6+: Neve
    ];

    const animaisReais = ['🐭', '🐦', '🐸', '🐰', '🦎'];
    let preys = []; 
    let obstacles = [];

    function resize() {
        canvas.width = gameArea.clientWidth;
        canvas.height = gameArea.clientHeight;
        cellW = canvas.width / cols;
        cellH = canvas.height / rows;
    }
    window.addEventListener('resize', resize);
    resize();

    function initGame(mode) {
        state.mode = mode;
        document.getElementById('start-screen').classList.add('hidden');
        setEnvironment();
        
        if (mode === 'multi') {
            document.getElementById('end-title').innerText = "PROCURANDO...";
            document.getElementById('end-title').style.color = "var(--primary)";
            document.getElementById('end-desc').innerText = "Aguardando um rival invadir seu território...";
            document.getElementById('end-screen').classList.remove('hidden');
            socket.emit('join_snake_duel', { profile: { name: 'Anaconda' } });
        } else {
            resetSnake(Math.floor(cols/2));
            obstacles = [];
            maintainPreys();
            state.isRunning = true;
            gameLoop();
        }
    }

    function setEnvironment() {
        let bgIndex = (state.level - 1) % backgrounds.length;
        gameArea.style.backgroundImage = backgrounds[bgIndex];
    }

    socket.on('snake_duel_start', (data) => {
        const isHost = data.players[0].id === socket.id;
        currentRoom = data.roomId; 
        opponent.id = data.players.find(p => p.id !== socket.id).id; 
        opponent.active = true;
        document.getElementById('end-screen').classList.add('hidden');

        resetSnake(isHost ? 5 : cols - 5);
        snake.dir = { x: isHost ? 1 : -1, y: 0 }; snake.nextDir = { x: isHost ? 1 : -1, y: 0 };
        opponent.body = [{ x: isHost ? cols - 5 : 5, y: Math.floor(rows/2), dir: {x: isHost ? -1 : 1, y: 0} }];

        obstacles = []; maintainPreys();
        state.score = 0; state.level = 1; state.baseSpeed = 4.5;
        updateHUD(); setEnvironment();
        state.isRunning = true; gameLoop();
    });

    socket.on('opponent_move', (data) => {
        if(opponent.active) { opponent.body = data.history; opponent.dir = data.dir; }
    });

    socket.on('duel_victory', () => { gameOver("VITÓRIA", "Você engoliu o rival inteiro!", "var(--success)"); });

    function resetSnake(startX) {
        snake.body = [ 
            { x: startX, y: Math.floor(rows/2) },
            { x: startX-1, y: Math.floor(rows/2) },
            { x: startX-2, y: Math.floor(rows/2) }
        ];
        snake.dir = { x: 1, y: 0 }; snake.nextDir = { x: 1, y: 0 };
    }

    function maintainPreys() {
        let maxPreys = 2 + state.level; 
        while(preys.length < maxPreys) {
            let px = Math.floor(Math.random() * cols);
            let py = Math.floor(Math.random() * rows);
            let valid = true;
            for(let o of obstacles) { if(o.x === px && o.y === py) valid = false; }
            if(valid) preys.push({ x: px, y: py, animal: animaisReais[Math.floor(Math.random() * animaisReais.length)] });
        }
    }

    function generateObstacles() {
        obstacles = [];
        let numObstacles = (state.level - 1) * 3; 
        for(let i=0; i<numObstacles; i++) {
            let ox = Math.floor(Math.random() * cols);
            let oy = Math.floor(Math.random() * rows);
            obstacles.push({x: ox, y: oy});
        }
    }

    function changeDir(x, y) {
        if (x !== 0 && snake.dir.x !== 0) return;
        if (y !== 0 && snake.dir.y !== 0) return;
        snake.nextDir = { x, y };
    }

    function handleProgression() {
        state.score += 10;
        let newLevel = Math.floor(state.score / 100) + 1;
        
        if (newLevel > state.level) {
            state.level = newLevel;
            if (state.level > state.maxLevel) return gameOver("SOBREVIVENTE MÁXIMO", "Você está no topo da cadeia alimentar.", "var(--success)");

            state.baseSpeed += 0.5; 
            generateObstacles(); 
            setEnvironment(); // Muda a imagem de fundo real
            
            if(window.parent && window.parent.gameLevelUp) window.parent.gameLevelUp(state.level);
        }
        updateHUD();
    }

    function updateHUD() {
        document.getElementById('ui-size').innerText = snake.body.length;
        document.getElementById('ui-score').innerText = state.score;
        document.getElementById('ui-level').innerText = state.level;
    }

    let lastTime = 0; let accumulatedTime = 0;
    function gameLoop(timestamp = 0) {
        if (!state.isRunning) return;
        let deltaTime = timestamp - lastTime;
        lastTime = timestamp; accumulatedTime += deltaTime;
        
        let tickInterval = 1000 / state.baseSpeed; 
        if (accumulatedTime > tickInterval) { update(); accumulatedTime = 0; }
        
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        snake.dir = { ...snake.nextDir };
        let head = { x: snake.body[0].x + snake.dir.x, y: snake.body[0].y + snake.dir.y };

        if (head.x < 0) head.x = cols - 1; if (head.x >= cols) head.x = 0;
        if (head.y < 0) head.y = rows - 1; if (head.y >= rows) head.y = 0;

        for (let i = 0; i < snake.body.length; i++) {
            if (head.x === snake.body[i].x && head.y === snake.body[i].y) return gameOver("AUTO-MORDIDA", `Sua cobra ficou grande demais. Tamanho: ${snake.body.length}`, "var(--danger)");
        }

        for (let o of obstacles) {
            if (head.x === o.x && head.y === o.y) return gameOver("ESMAGADA", "Você bateu numa rocha sólida!", "var(--danger)");
        }

        snake.body.unshift(head);

        if (state.mode === 'multi') {
            socket.emit('snake_move', { roomId: currentRoom, head: head, history: snake.body, dir: snake.dir });
            if (opponent.active) {
                for (let pt of opponent.body) {
                    if (head.x === pt.x && head.y === pt.y) {
                        socket.emit('snake_death', { roomId: currentRoom, opponentId: opponent.id });
                        return gameOver("PRESA", "Você bateu no Invasor!", "var(--danger)");
                    }
                }
            }
        }

        let ate = false;
        for (let i = 0; i < preys.length; i++) {
            if (head.x === preys[i].x && head.y === preys[i].y) {
                preys.splice(i, 1);
                handleProgression(); maintainPreys(); ate = true; break;
            }
        }

        if (!ate) { snake.body.pop(); }
    }

    // ==========================================
    // MOTOR DE RENDERIZAÇÃO REALISTA (TUBULAR)
    // ==========================================
    function drawRealisticSnake(s, isOpponent) {
        if(s.body.length === 0) return;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 1. Corpo Contínuo Tubular
        for (let i = s.body.length - 1; i > 0; i--) {
            let p1 = s.body[i];
            let p2 = s.body[i-1];
            
            // Impede que desenhe uma linha cortando a tela quando a cobra atravessa a parede
            if (Math.abs(p1.x - p2.x) > 1 || Math.abs(p1.y - p2.y) > 1) continue;

            let px1 = p1.x * cellW + cellW/2;
            let py1 = p1.y * cellH + cellH/2;
            let px2 = p2.x * cellW + cellW/2;
            let py2 = p2.y * cellH + cellH/2;

            let radius = (cellW / 2) * 1.0;
            let tailDist = s.body.length - 1 - i;
            if (tailDist < 8) radius = radius * (0.3 + 0.7 * (tailDist / 8)); // Rabo afinando suavemente

            // Corpo Principal (Verde Escuro)
            ctx.beginPath();
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
            ctx.lineWidth = radius * 2;
            ctx.strokeStyle = isOpponent ? s.colorBody : s.colorBody;
            ctx.stroke();

            // Textura da Barriga/Costas (Linha Interna mais clara)
            ctx.beginPath();
            ctx.moveTo(px1, py1); ctx.lineTo(px2, py2);
            ctx.lineWidth = radius * 1.2;
            ctx.strokeStyle = isOpponent ? s.colorBelly : s.colorBelly;
            ctx.stroke();

            // Manchas/Escamas Escuras nas Costas
            if (i % 3 === 0 && tailDist > 3) {
                ctx.fillStyle = isOpponent ? s.colorSpine : s.colorSpine;
                ctx.beginPath();
                ctx.arc((px1+px2)/2, (py1+py2)/2, radius * 0.4, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // 2. Cabeça Orgânica (Alinhada com o pescoço)
        let head = s.body[0];
        let px = head.x * cellW + cellW/2;
        let py = head.y * cellH + cellH/2;
        
        let dirX = s.dir ? s.dir.x : (s.body.length > 1 ? head.x - s.body[1].x : 1);
        let dirY = s.dir ? s.dir.y : (s.body.length > 1 ? head.y - s.body[1].y : 0);
        let angle = Math.atan2(dirY, dirX);

        let isMouthOpen = false;
        if (!isOpponent) {
            for (let p of preys) {
                if (Math.hypot(head.x - p.x, head.y - p.y) < 3) { isMouthOpen = true; break; }
            }
        }

        let headLen = cellW * 0.9;
        let headWid = cellW * 0.75;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle);

        ctx.fillStyle = isOpponent ? s.colorBody : s.colorBody;

        if (isMouthOpen) {
            // Mandíbula e Dentes
            ctx.save(); ctx.rotate(-0.35); ctx.beginPath();
            ctx.ellipse(headLen/2, 0, headLen, headWid/2, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
            ctx.save(); ctx.rotate(0.35); ctx.beginPath();
            ctx.ellipse(headLen/2, 0, headLen*0.9, headWid/2.5, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
            
            ctx.fillStyle = '#450a0a'; ctx.beginPath(); ctx.arc(0, 0, headWid*0.5, -0.4, 0.4); ctx.fill();
            ctx.fillStyle = '#f8fafc'; ctx.save(); ctx.rotate(-0.35); ctx.beginPath();
            ctx.moveTo(headLen*0.8, headWid/4); ctx.lineTo(headLen*0.9, headWid/2); ctx.lineTo(headLen*0.7, headWid/4); ctx.fill(); ctx.restore();
        } else {
            // Cabeça Fechada e Língua
            ctx.beginPath(); ctx.ellipse(headLen/2, 0, headLen, headWid, 0, 0, Math.PI*2); ctx.fill();
            if (Math.random() > 0.85) {
                ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
                ctx.beginPath(); ctx.moveTo(headLen, 0); ctx.lineTo(headLen + 8, 0); ctx.lineTo(headLen + 12, -4);
                ctx.moveTo(headLen + 8, 0); ctx.lineTo(headLen + 12, 4); ctx.stroke();
            }
        }

        // Olhos Realistas
        ctx.fillStyle = '#020617'; 
        ctx.beginPath(); ctx.arc(headLen*0.3, -headWid*0.5, headWid*0.25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(headLen*0.3, headWid*0.5, headWid*0.25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#eab308'; 
        ctx.beginPath(); ctx.arc(headLen*0.3, -headWid*0.5, headWid*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(headLen*0.3, headWid*0.5, headWid*0.15, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function draw() {
        // Limpa o canvas para mostrar a imagem de fundo realística do CSS
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Aplica uma camada escurecida para a cobra e as presas destacarem da foto
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenha Pedras 
        ctx.fillStyle = '#475569';
        for (let o of obstacles) {
            let px = o.x * cellW + cellW/2; let py = o.y * cellH + cellH/2;
            ctx.beginPath(); ctx.moveTo(px - cellW*0.4, py); ctx.lineTo(px - cellW*0.2, py - cellH*0.4);
            ctx.lineTo(px + cellW*0.3, py - cellH*0.3); ctx.lineTo(px + cellW*0.4, py + cellH*0.2);
            ctx.lineTo(px, py + cellH*0.4); ctx.fill();
            ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.arc(px + cellW*0.1, py + cellH*0.1, cellW*0.2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#475569';
        }

        // Desenha Presas Vivas
        let wiggle = Math.sin(Date.now() / 80) * 0.15; 
        for (let p of preys) {
            ctx.save(); ctx.translate(p.x * cellW + cellW/2, p.y * cellH + cellH/2);
            ctx.rotate(wiggle); ctx.font = `${cellW * 1.3}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(p.animal, 0, 0); ctx.restore();
        }

        // Desenha as Cobras contínuas
        if (state.mode === 'multi' && opponent.active) drawRealisticSnake(opponent, true);
        drawRealisticSnake(snake, false);
    }

    function gameOver(title, desc, color) {
        state.isRunning = false;
        document.getElementById('end-title').innerText = title;
        document.getElementById('end-title').style.color = color;
        document.getElementById('end-desc').innerText = desc;
        document.getElementById('end-screen').classList.remove('hidden');
        if(window.parent && window.parent.gameEarnXP) window.parent.gameEarnXP(state.score);
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') changeDir(0, -1);
        if (e.key === 'ArrowDown') changeDir(0, 1);
        if (e.key === 'ArrowLeft') changeDir(-1, 0);
        if (e.key === 'ArrowRight') changeDir(1, 0);
    });
</script>
</body>
</html>
