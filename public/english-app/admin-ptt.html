<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Admin Max - Inglês PTT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --bg-color: #05050A; --card-bg: rgba(15, 23, 42, 0.9); --primary: #3B82F6; --success: #10B981; --danger: #EF4444; --text-main: #F8FAFC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .header h1 { font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1; overflow: hidden; }
        
        .panel { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .panel-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: white; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; color: #CBD5E1; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; background: #0F172A; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 8px; font-size: 15px; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        
        .dynamic-fields { padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); margin-top: 15px; }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 20px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59,130,246,0.4); }
        .btn-danger { background: var(--danger); margin-top: 10px; }
        .btn-danger:hover { box-shadow: 0 5px 15px rgba(239,68,68,0.4); }

        .exercise-card { background: #0F172A; border-left: 4px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .exercise-card.listening { border-color: #10B981; }
        .exercise-card.speaking { border-color: #F59E0B; }
        .exercise-card.reading { border-color: #8B5CF6; }
        .exercise-card.writing { border-color: #3B82F6; }
        .ex-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; background: rgba(255,255,255,0.1); }
        .ex-text { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
        .ex-details { font-size: 12px; color: #94A3B8; display: flex; flex-direction: column; gap: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="material-icons-round" style="font-size: 32px;">dashboard_customize</span> Centro de Comando PTT</h1>
        <div style="font-size: 13px; font-weight: 600; color: #94A3B8;">Conectado à Base de Dados Central</div>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-title"><span>1. Forjar Nova Missão</span></div>

            <div class="form-group">
                <label>Selecione a Fase (Destino)</label>
                <select id="nodeId" onchange="loadSavedExercises()">
                    <option value="som_1">Fase 1: Som (/p/ vs /b/)</option>
                    <option value="som_2">Fase 2: Som (/t/ vs /d/)</option>
                    <option value="logica_1">Fase 1: Lógica (Ordem SVO)</option>
                    <option value="contexto_1">Fase 1: Contexto (Sobrevivência)</option>
                    <option value="contexto_free_1">Tema Livre: Viagem (Aeroporto)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Habilidade (Motor Visual)</label>
                <select id="type" onchange="toggleFields()">
                    <option value="listen_isolate">🔊 LISTENING: Ouvir e Aprender (Apresentação de Áudio)</option>
                    <option value="minimal_pair">🎧 LISTENING: Teste de Ouvido (Múltipla Escolha)</option>
                    <option value="repeat_sentence">🎙️ SPEAKING: Falar no Microfone (Avaliação de Voz)</option>
                    <option value="context_cloze">📖 READING: Interpretação (Preencher Lacuna)</option>
                    <option value="sentence_assembly">✍️ WRITING: Sintaxe (Arrastar Blocos de Frase)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Instrução para o Aluno na Tela</label>
                <input type="text" id="text" placeholder="Ex: Ouça com atenção..." required>
            </div>

            <div class="form-group">
                <label>Dica Neuro-Cognitiva (Opcional)</label>
                <input type="text" id="advTip" placeholder="Ex: Preste atenção na vibração.">
            </div>
            
            <div class="form-group">
                <label>Símbolo Fonético / IPA (Opcional)</label>
                <input type="text" id="ipa" placeholder="Ex: /pæt/">
            </div>

            <div id="dynamic-zone" class="dynamic-fields"></div>

            <button class="btn-submit" id="submitBtn" onclick="injectExercise()"><span class="material-icons-round">rocket_launch</span> Injetar no Servidor</button>
            <button class="btn-submit btn-danger" id="clearBtn" onclick="clearPhase()"><span class="material-icons-round">delete_sweep</span> Limpar Todos os Dados desta Fase</button>
        </div>

        <div class="panel" style="background: rgba(15, 23, 42, 0.5);">
            <div class="panel-title">
                <span>2. Arsenal da Fase Selecionada</span>
                <button onclick="loadSavedExercises()" style="background:transparent; border:none; color:var(--primary); cursor:pointer;"><span class="material-icons-round">sync</span></button>
            </div>
            <div id="arsenal-status" style="font-size: 13px; color: #94A3B8; margin-bottom: 15px;">Sincronizando com o Quartel General...</div>
            <div id="arsenal-list" style="display: flex; flex-direction: column; flex: 1;"></div>
        </div>
    </div>

    <script>
        function toggleFields() {
            const type = document.getElementById('type').value;
            const zone = document.getElementById('dynamic-zone');
            
            if (type === 'listen_isolate') {
                zone.innerHTML = `
                    <div class="form-group"><label style="color:var(--success);">Texto do Áudio (O que a voz deve falar)</label><input type="text" id="audioText" placeholder="Ex: Pat" style="border-color:var(--success);"></div>
                `;
            } else if (type === 'minimal_pair') {
                zone.innerHTML = `
                    <div class="form-group"><label>Opções (Separadas por vírgula)</label><input type="text" id="options" placeholder="Pat, Bat"></div>
                    <div class="form-group"><label>Índice da Resposta Certa (Ex: 0)</label><input type="number" id="answer" value="0"></div>
                    <div class="form-group"><label style="color:var(--success);">Texto do Áudio (O que a voz deve falar)</label><input type="text" id="audioText" placeholder="Ex: Pat" style="border-color:var(--success);"></div>
                `;
            } else if (type === 'repeat_sentence') {
                zone.innerHTML = `
                    <div class="form-group"><label>Frase Alvo (O que o Motor de Voz vai ouvir)</label><input type="text" id="target" placeholder="pat has a pet"></div>
                    <div class="form-group"><label>Frase Visível na Tela</label><input type="text" id="displayWord" placeholder="Pat has a pet."></div>
                `;
            } else if (type === 'sentence_assembly') {
                zone.innerHTML = `
                    <div class="form-group"><label>Blocos Embaraçados (Separados por vírgula)</label><input type="text" id="options" placeholder="coffee, like, I"></div>
                    <div class="form-group"><label>Frase Completa Correta</label><input type="text" id="answerStr" placeholder="I like coffee"></div>
                `;
            } else if (type === 'context_cloze') {
                zone.innerHTML = `
                    <div class="form-group"><label>Situação/Contexto</label><input type="text" id="context" placeholder="Você está num restaurante..."></div>
                    <div class="form-group"><label>Frase com Lacuna (Use ___ para a lacuna)</label><input type="text" id="clozeText" placeholder="I ___ some water."></div>
                    <div class="form-group"><label>Opções para a Lacuna (Separadas por vírgula)</label><input type="text" id="options" placeholder="want, wants, wanting"></div>
                    <div class="form-group"><label>Índice da Resposta Certa</label><input type="number" id="answer" value="0"></div>
                `;
            }
        }
        
        toggleFields();
        loadSavedExercises();

        async function injectExercise() {
            const btn = document.getElementById('submitBtn');
            const type = document.getElementById('type').value;
            
            const exercise = {
                type: type,
                text: document.getElementById('text').value,
                advTip: document.getElementById('advTip').value,
                ipa: document.getElementById('ipa').value
            };

            if (type === 'listen_isolate') {
                exercise.audioText = document.getElementById('audioText').value;
            } else if (type === 'minimal_pair') {
                exercise.options = document.getElementById('options').value.split(',').map(s => s.trim());
                exercise.answer = parseInt(document.getElementById('answer').value);
                exercise.audioText = document.getElementById('audioText').value;
            } else if (type === 'repeat_sentence') {
                exercise.target = document.getElementById('target').value;
                exercise.displayWord = document.getElementById('displayWord').value;
            } else if (type === 'sentence_assembly') {
                exercise.options = document.getElementById('options').value.split(',').map(s => s.trim());
                exercise.answer = document.getElementById('answerStr').value.trim();
            } else if (type === 'context_cloze') {
                exercise.context = document.getElementById('context').value;
                exercise.text = document.getElementById('clozeText').value; 
                exercise.options = document.getElementById('options').value.split(',').map(s => s.trim());
                exercise.answer = parseInt(document.getElementById('answer').value);
            }

            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> A Injetar...`;
            
            try {
                const res = await fetch('/api/english/admin/exercise', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nodeId: document.getElementById('nodeId').value, exercise: exercise })
                });
                const data = await res.json();
                
                if (data.success) {
                    btn.style.background = "var(--success)"; btn.innerHTML = `<span class="material-icons-round">check_circle</span> Sucesso!`;
                    setTimeout(() => { btn.style.background = ""; btn.innerHTML = `<span class="material-icons-round">rocket_launch</span> Injetar no Servidor`; }, 2000);
                    loadSavedExercises(); 
                } else alert(data.message);
            } catch (e) { alert("Falha na rede."); btn.innerHTML = "Erro Crítico"; }
        }

        async function loadSavedExercises() {
            const nodeId = document.getElementById('nodeId').value;
            const statusEl = document.getElementById('arsenal-status');
            const listEl = document.getElementById('arsenal-list');
            statusEl.innerText = "A Rastrear Banco de Dados..."; listEl.innerHTML = '';

            try {
                const res = await fetch(`/api/english/node/${nodeId}`);
                const data = await res.json();

                if (data.success && data.exercises && data.exercises.length > 0) {
                    statusEl.innerText = `${data.exercises.length} Missões ativas nesta Fase.`;
                    data.exercises.forEach((ex, index) => {
                        let skillName = ""; let cssClass = ""; let detailsHtml = "";
                        
                        if (ex.type === 'listen_isolate') { skillName = "🔊 Ouvir"; cssClass = "listening"; detailsHtml = `<b>Pronúncia Exata:</b> ${ex.audioText}`; }
                        else if (ex.type === 'minimal_pair') { skillName = "🎧 Listening"; cssClass = "listening"; detailsHtml = `<b>Pronúncia Exata:</b> ${ex.audioText || ex.options[ex.answer]}<br><b>Opções:</b> ${ex.options.join(' / ')}`; }
                        else if (ex.type.startsWith('repeat')) { skillName = "🎙️ Speaking"; cssClass = "speaking"; detailsHtml = `<b>Alvo (Voz):</b> ${ex.target}`; }
                        else if (ex.type === 'context_cloze') { skillName = "📖 Reading"; cssClass = "reading"; detailsHtml = `<b>Contexto:</b> ${ex.context}`; }
                        else if (ex.type === 'sentence_assembly') { skillName = "✍️ Writing"; cssClass = "writing"; detailsHtml = `<b>Frase Correta:</b> ${ex.answer}`; }

                        listEl.innerHTML += `<div class="exercise-card ${cssClass}"><div style="display:flex; justify-content:space-between; align-items:center;"><span class="ex-badge">${skillName}</span><span style="font-size:10px; color:#64748B;">Nº ${index + 1}</span></div><div class="ex-text">${ex.text}</div><div class="ex-details">${detailsHtml}</div></div>`;
                    });
                } else {
                    statusEl.innerText = "Aviso: Nenhuma missão cadastrada."; listEl.innerHTML = `<div style="text-align:center; color:#64748B; padding:30px;"><span class="material-icons-round" style="font-size:40px; margin-bottom:10px; opacity:0.5;">folder_open</span><br>Fase vazia.</div>`;
                }
            } catch (e) { statusEl.innerText = "Falha ao conectar com o Quartel General."; }
        }

        async function clearPhase() {
            if(!confirm("ALERTA MÁXIMO: Isto vai destruir todas as missões desta fase. Tem certeza?")) return;
            const btn = document.getElementById('clearBtn'); const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> A Limpar...`;
            try {
                const res = await fetch('/api/english/admin/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nodeId: document.getElementById('nodeId').value }) });
                const data = await res.json();
                if(data.success) { btn.innerHTML = `<span class="material-icons-round">done_all</span> Fase Limpa!`; setTimeout(() => { btn.innerHTML = originalText; }, 2000); loadSavedExercises(); }
            } catch(e) { alert("Erro ao limpar."); btn.innerHTML = originalText; }
        }
    </script>
</body>
</html>
