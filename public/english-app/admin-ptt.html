<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QG Admin Max - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --bg: #05050A; --surface: #0f172a; --surface-border: rgba(255,255,255,0.1); --primary: #3B82F6; --success: #10B981; --danger: #EF4444; --text: #F8FAFC; --text-muted: #94A3B8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(15,23,42,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--surface-border); z-index: 10; }
        .header h1 { font-size: 18px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; } 

        .mode-toggle { display: flex; background: var(--surface); border-radius: 16px; padding: 6px; margin-bottom: 25px; border: 1px solid var(--surface-border); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .mode-btn { flex: 1; padding: 12px; text-align: center; border-radius: 12px; border: none; background: transparent; color: var(--text-muted); font-weight: 800; font-size: 13px; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 6px; text-transform: uppercase; }
        .mode-btn.active.blue { background: rgba(59, 130, 246, 0.15); color: var(--primary); box-shadow: 0 2px 10px rgba(59,130,246,0.2); }
        .mode-btn.active.green { background: rgba(16, 185, 129, 0.15); color: var(--success); box-shadow: 0 2px 10px rgba(16,185,129,0.2); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background: var(--surface); border: 1px solid var(--surface-border); color: white; padding: 16px; border-radius: 14px; font-size: 15px; outline: none; transition: 0.2s; appearance: none; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; margin-bottom: 15px; }

        .dynamic-zone { background: rgba(0,0,0,0.4); padding: 18px; border-radius: 16px; border: 1px dashed rgba(255,255,255,0.2); margin-top: 10px; margin-bottom: 20px; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 20px; background: rgba(5,5,10,0.95); backdrop-filter: blur(15px); border-top: 1px solid var(--surface-border); display: flex; gap: 12px; z-index: 50; }
        .btn-main { flex: 1; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 900; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; cursor: pointer; text-transform: uppercase; }
        .btn-main:active { transform: scale(0.95); }
        .btn-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--surface); border: 1px solid var(--surface-border); display: flex; justify-content: center; align-items: center; color: var(--text-muted); transition: 0.2s; cursor: pointer; }
        .btn-icon:active { transform: scale(0.9); background: rgba(255,255,255,0.1); color: white; }

        /* GAVETA DO ARSENAL */
        .arsenal-modal { position: fixed; top: 100%; left: 0; width: 100%; height: 100%; background: var(--bg); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; display: flex; flex-direction: column; }
        .arsenal-modal.open { top: 0; }
        .arsenal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--surface); border-bottom: 1px solid var(--surface-border); }
        .arsenal-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

        .exercise-card { background: var(--surface); border-left: 4px solid var(--primary); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .ex-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; background: rgba(255,255,255,0.1); }
        .ex-text { font-size: 15px; font-weight: 700; margin-bottom: 5px; color: white; }
        .ex-details { font-size: 12px; color: #94A3B8; display: flex; flex-direction: column; gap: 4px; }
        
        .reorder-btns { display: flex; align-items: center; gap: 4px; }
        .reorder-btn { background: rgba(255,255,255,0.05); border: none; color: white; cursor: pointer; border-radius: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .reorder-btn:active { background: var(--primary); }
        .reorder-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="material-icons-round">bolt</span> QG Admin</h1>
        <div style="font-size: 12px; font-weight: 800; color: var(--success); display: flex; align-items: center; gap: 4px;">
            <div style="width:8px; height:8px; background:var(--success); border-radius:50%; box-shadow:0 0 10px var(--success); animation: pulseRed 1.5s infinite;"></div>
            ON-LINE
        </div>
    </div>

    <div class="content">
        <div class="mode-toggle">
            <button class="mode-btn active blue" id="btn-estrutural" onclick="selectCore('estrutural')">
                <span class="material-icons-round" style="font-size: 28px;">account_tree</span> Estrutural
            </button>
            <button class="mode-btn" id="btn-performance" onclick="selectCore('performance')">
                <span class="material-icons-round" style="font-size: 28px;">speed</span> Performance
            </button>
        </div>

        <input type="hidden" id="core-type" value="estrutural">

        <div class="input-group">
            <label>Alvo da Missão (Nó/Habilidade)</label>
            <select id="nodeId" onchange="updateExerciseTypes(); loadSavedExercises();">
                <optgroup label="🔵 NÚCLEO ESTRUTURAL" id="opt-estrutural">
                    <option value="phonetics_1">Fonética 1: Sons e Vibrações</option>
                    <option value="syntax_1">Sintaxe 1: Lógica SVO e Ordem</option>
                    <option value="semantics_1">Semântica 1: Sentidos e Contexto</option>
                </optgroup>
                <optgroup label="🟢 NÚCLEO PERFORMANCE" id="opt-performance" class="hidden">
                    <option value="skill_listening">🎧 Listening (Escuta)</option>
                    <option value="skill_speaking">🎙️ Speaking (Fala)</option>
                    <option value="skill_reading">📖 Reading (Leitura)</option>
                    <option value="skill_writing">✍️ Writing (Escrita & Digitação)</option>
                    <option value="skill_training">🏋️ Training (Treinamento Misto)</option>
                </optgroup>
            </select>
        </div>

        <div class="input-group">
            <label>Mecânica de Combate (Tipo)</label>
            <select id="type" onchange="toggleFields()"></select>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Dificuldade</label>
                <select id="difficulty">
                    <option value="1">Lvl 1 - Lento</option>
                    <option value="2">Lvl 2 - Base</option>
                    <option value="3">Lvl 3 - Médio</option>
                    <option value="4">Lvl 4 - Rápido</option>
                    <option value="5">Lvl 5 - Nativo</option>
                </select>
            </div>
            <div class="input-group">
                <label>Voz da IA (TTS)</label>
                <select id="voiceProfile">
                    <option value="en-US-male">🇺🇸 US Masc</option>
                    <option value="en-US-female">🇺🇸 US Fem</option>
                    <option value="en-GB-male">🇬🇧 UK Masc</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Comando / Instrução</label>
            <input type="text" id="text" placeholder="Ex: Traduza a frase..." required>
        </div>

        <div id="dynamic-zone" class="dynamic-zone"></div>

        <div class="row">
            <div class="input-group">
                <label>Objetivo Pedagógico</label>
                <input type="text" id="pedagogicObj" placeholder="Ex: Foco no Verbo To Be">
            </div>
            <div class="input-group">
                <label>Tags</label>
                <input type="text" id="tags" placeholder="Ex: travel, food">
            </div>
        </div>

        <div class="input-group">
            <label>Dica Neuro-Cognitiva (Exibida no erro)</label>
            <textarea id="advTip" placeholder="Explique a lógica ou a posição da boca..."></textarea>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-icon" onclick="openArsenal()" title="Ver Arsenal">
            <span class="material-icons-round" style="font-size: 28px;">inventory_2</span>
        </button>
        <button class="btn-main" id="submitBtn" onclick="injectExercise()">
            <span class="material-icons-round">rocket_launch</span> INJETAR
        </button>
    </div>

    <div id="arsenal-modal" class="arsenal-modal">
        <div class="arsenal-header">
            <h2 style="margin:0; font-size: 18px; color: var(--primary); display:flex; align-items:center; gap:8px;">
                <span class="material-icons-round">inventory_2</span> Arsenal
            </h2>
            <button class="btn-icon" style="width: 40px; height: 40px;" onclick="closeArsenal()"><span class="material-icons-round">expand_more</span></button>
        </div>
        <div style="padding: 15px 20px 0 20px; font-size: 13px; color: var(--text-muted);" id="arsenal-status">A verificar base de dados...</div>
        <div id="arsenal-list" class="arsenal-list"></div>
        <div style="padding: 20px; background: var(--surface); border-top: 1px solid var(--surface-border);">
            <button class="btn-main" style="background: transparent; border: 1px solid var(--danger); color: var(--danger); width: 100%;" id="clearBtn" onclick="clearPhase()">
                <span class="material-icons-round">delete_sweep</span> Expurgo Total da Fase
            </button>
        </div>
    </div>

    <script>
        let currentArsenalList = []; // Guarda a lista em tempo real para podermos reordenar

        function selectCore(core) {
            document.getElementById('core-type').value = core;
            const btnEst = document.getElementById('btn-estrutural'); const btnPerf = document.getElementById('btn-performance');
            const optEst = document.getElementById('opt-estrutural'); const optPerf = document.getElementById('opt-performance');

            if(core === 'estrutural') {
                btnEst.className = 'mode-btn active blue'; btnPerf.className = 'mode-btn';
                optEst.classList.remove('hidden'); optPerf.classList.add('hidden');
                document.getElementById('nodeId').value = 'phonetics_1';
            } else {
                btnPerf.className = 'mode-btn active green'; btnEst.className = 'mode-btn';
                optPerf.classList.remove('hidden'); optEst.classList.add('hidden');
                document.getElementById('nodeId').value = 'skill_listening';
            }
            updateExerciseTypes(); loadSavedExercises();
        }

        function openArsenal() { document.getElementById('arsenal-modal').classList.add('open'); loadSavedExercises(); }
        function closeArsenal() { document.getElementById('arsenal-modal').classList.remove('open'); }

        function updateExerciseTypes() {
            const target = document.getElementById('nodeId').value;
            const typeSelect = document.getElementById('type');
            typeSelect.innerHTML = '';
            if (target.startsWith('phonetics')) { typeSelect.innerHTML += `<option value="listen_isolate">🔊 Fonética: Isolar Som</option><option value="minimal_pair">🎧 Fonética: Comparação</option>`; } 
            else if (target.startsWith('syntax')) { typeSelect.innerHTML += `<option value="syntax_assembly">🧩 Sintaxe: Montagem</option><option value="grammar_rules">📐 Sintaxe: Regra</option>`; } 
            else if (target.startsWith('semantics')) { typeSelect.innerHTML += `<option value="meaning_match">🧠 Semântica: Significado</option><option value="context_cloze">📖 Semântica: Lacuna</option>`; } 
            else if (target === 'skill_listening') { typeSelect.innerHTML += `<option value="dictation">⌨️ Dictation</option><option value="audio_comprehension">🎧 Compreensão</option>`; } 
            else if (target === 'skill_speaking') { typeSelect.innerHTML += `<option value="repeat_sentence">🎙️ Fluência Rápida</option><option value="free_speech">💬 Resposta com IA</option>`; } 
            else if (target === 'skill_reading') { typeSelect.innerHTML += `<option value="speed_reading">⚡ Speed Reading</option><option value="true_false">✅ V ou F</option>`; } 
            else if (target === 'skill_writing') { typeSelect.innerHTML += `<option value="fast_typing">⌨️ Digitação Ágil</option><option value="translation">🌍 Tradução Imediata</option>`; } 
            else if (target === 'skill_training') { typeSelect.innerHTML += `<option value="memorization">🔁 Memorização</option><option value="simultaneous_training">🔥 Treino 360</option>`; }
            toggleFields();
        }

        function toggleFields() {
            const type = document.getElementById('type').value;
            const zone = document.getElementById('dynamic-zone');
            if (type === 'listen_isolate' || type === 'meaning_match') zone.innerHTML = `<div class="input-group"><label style="color:var(--success);">Áudio TTS</label><input type="text" id="audioText"></div><div class="input-group"><label>IPA Fonético</label><input type="text" id="ipa"></div>`;
            else if (type === 'minimal_pair' || type === 'audio_comprehension' || type === 'grammar_rules') zone.innerHTML = `<div class="input-group"><label>Opções (Vírgula)</label><input type="text" id="options"></div><div class="input-group"><label>Índice Correto (0, 1, 2)</label><input type="number" id="answer" value="0"></div><div class="input-group"><label style="color:var(--success);">Áudio Associado</label><input type="text" id="audioText"></div>`;
            else if (type === 'syntax_assembly') zone.innerHTML = `<div class="input-group"><label>Blocos Desordenados</label><input type="text" id="options"></div><div class="input-group"><label>Frase Completa</label><input type="text" id="answerStr"></div>`;
            else if (type === 'context_cloze') zone.innerHTML = `<div class="input-group"><label>Contexto Base</label><input type="text" id="context"></div><div class="input-group"><label>Opções (Vírgula)</label><input type="text" id="options"></div><div class="input-group"><label>Índice Correto</label><input type="number" id="answer" value="0"></div>`;
            else if (type === 'dictation' || type === 'fast_typing' || type === 'translation') zone.innerHTML = `<div class="input-group"><label style="color:var(--success);">Áudio Suporte</label><input type="text" id="audioText"></div><div class="input-group"><label>Resposta Exata</label><input type="text" id="answerStr"></div>`;
            else if (type === 'repeat_sentence' || type === 'free_speech') zone.innerHTML = `<div class="input-group"><label>Alvo Validação IA</label><input type="text" id="target"></div><div class="input-group"><label>Texto Exibido</label><input type="text" id="displayWord"></div>`;
            else if (type === 'true_false') zone.innerHTML = `<div class="input-group"><label>Resposta</label><select id="answer"><option value="1">Verdadeiro</option><option value="0">Falso</option></select></div>`;
            else if (type === 'simultaneous_training' || type === 'memorization') zone.innerHTML = `<div class="input-group"><label style="color:var(--success);">Áudio TTS</label><input type="text" id="audioText"></div><div class="input-group"><label>Tradução Exigida</label><input type="text" id="answerStr"></div>`;
        }
        updateExerciseTypes();

        async function injectExercise() {
            const btn = document.getElementById('submitBtn');
            const type = document.getElementById('type').value; const core = document.getElementById('core-type').value; const targetId = document.getElementById('nodeId').value;
            const payload = { core, nodeId: targetId, exercise: { type, difficulty: parseInt(document.getElementById('difficulty').value), voiceProfile: document.getElementById('voiceProfile').value, pedagogicalObjective: document.getElementById('pedagogicObj').value, tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t), text: document.getElementById('text').value, advTip: document.getElementById('advTip').value } };
            const optEl = document.getElementById('options'); if (optEl) payload.exercise.options = optEl.value.split(',').map(s => s.trim());
            const ansEl = document.getElementById('answer'); if (ansEl) payload.exercise.answer = parseInt(ansEl.value);
            const ansStrEl = document.getElementById('answerStr'); if (ansStrEl) payload.exercise.answer = ansStrEl.value.trim();
            const audEl = document.getElementById('audioText'); if (audEl) payload.exercise.audioText = audEl.value;
            const ipaEl = document.getElementById('ipa'); if (ipaEl) payload.exercise.ipa = ipaEl.value;
            const ctxEl = document.getElementById('context'); if (ctxEl) payload.exercise.context = ctxEl.value;
            const trgEl = document.getElementById('target'); if (trgEl) payload.exercise.target = trgEl.value;
            const dspEl = document.getElementById('displayWord'); if (dspEl) payload.exercise.displayWord = dspEl.value;

            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> Processando...`;
            try {
                const res = await fetch('/api/english/admin/inject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) { btn.innerHTML = `<span class="material-icons-round">check_circle</span> Injetado!`; setTimeout(() => { btn.innerHTML = `<span class="material-icons-round">rocket_launch</span> INJETAR`; }, 2000); document.getElementById('text').value = ''; if(ansStrEl) ansStrEl.value = ''; loadSavedExercises(); } else alert(data.message);
            } catch (e) { alert("Falha na rede."); btn.innerHTML = "Erro Crítico"; }
        }

        async function loadSavedExercises() {
            const nodeId = document.getElementById('nodeId').value;
            const statusEl = document.getElementById('arsenal-status');
            try {
                const res = await fetch(`/api/english/node/${nodeId}`);
                const data = await res.json();
                if (data.success && data.exercises && data.exercises.length > 0) {
                    currentArsenalList = data.exercises;
                    statusEl.innerHTML = `Foram encontrados <b style="color:white;">${data.exercises.length}</b> Armamentos.`;
                    renderArsenalUI();
                } else {
                    currentArsenalList = [];
                    statusEl.innerText = "Aviso: Nenhuma missão cadastrada."; 
                    document.getElementById('arsenal-list').innerHTML = `<div style="text-align:center; color:#64748B; padding:40px 20px;"><span class="material-icons-round" style="font-size:40px; margin-bottom:10px; opacity:0.5;">inventory_2</span><br>Base Vazia.</div>`;
                }
            } catch (e) { statusEl.innerText = "Falha ao conectar com a Base de Dados."; }
        }

        function renderArsenalUI() {
            const listEl = document.getElementById('arsenal-list'); listEl.innerHTML = '';
            currentArsenalList.forEach((ex, index) => {
                let skillName = ex.type.toUpperCase().replace('_', ' '); 
                let detailsHtml = "";
                if (ex.options) detailsHtml += `<b>Opções:</b> ${ex.options.join(' | ')}<br>`;
                if (ex.answer !== undefined) detailsHtml += `<b>Correto:</b> ${ex.answer}<br>`;
                if (ex.target) detailsHtml += `<b>Alvo:</b> ${ex.target}<br>`;

                // 🔥 BOTÕES DE REORDENAÇÃO (CIMA E BAIXO) 🔥
                const arrowsHtml = `
                    <div class="reorder-btns">
                        <button class="reorder-btn" onclick="moveExercise(${index}, -1)" ${index === 0 ? 'disabled' : ''}><span class="material-icons-round">arrow_upward</span></button>
                        <button class="reorder-btn" onclick="moveExercise(${index}, 1)" ${index === currentArsenalList.length - 1 ? 'disabled' : ''}><span class="material-icons-round">arrow_downward</span></button>
                        <span style="font-size:12px; color:var(--primary); font-weight:900; margin-left:8px;">#${index + 1}</span>
                    </div>
                `;

                listEl.innerHTML += `
                    <div class="exercise-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                            <span class="ex-badge">${skillName}</span>
                            ${arrowsHtml}
                        </div>
                        <div class="ex-text">${ex.text || 'Sem instrução'}</div>
                        <div class="ex-details">${detailsHtml}</div>
                    </div>
                `;
            });
        }

        // 🔥 FUNÇÃO DE REORDENAÇÃO 🔥
        async function moveExercise(index, direction) {
            if (direction === -1 && index === 0) return;
            if (direction === 1 && index === currentArsenalList.length - 1) return;

            // Troca os elementos de posição localmente
            const temp = currentArsenalList[index];
            currentArsenalList[index] = currentArsenalList[index + direction];
            currentArsenalList[index + direction] = temp;

            // Renderiza logo para sensação de rapidez
            renderArsenalUI();

            // Grava na Nuvem
            try {
                const res = await fetch('/api/english/admin/reorder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nodeId: document.getElementById('nodeId').value, newOrder: currentArsenalList })
                });
                const data = await res.json();
                if (!data.success) { alert("Erro ao salvar ordem no servidor."); loadSavedExercises(); }
            } catch(e) { alert("Falha na rede ao reordenar."); loadSavedExercises(); }
        }

        async function clearPhase() {
            if(!confirm("ALERTA MÁXIMO: Isto vai destruir TODAS as missões da fase selecionada. Tem certeza absoluta?")) return;
            const btn = document.getElementById('clearBtn'); const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> Expurgo em Andamento...`;
            try {
                const res = await fetch('/api/english/admin/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nodeId: document.getElementById('nodeId').value }) });
                const data = await res.json();
                if(data.success) { btn.innerHTML = `<span class="material-icons-round">done_all</span> Base Limpa!`; setTimeout(() => { btn.innerHTML = originalText; closeArsenal(); }, 1500); loadSavedExercises(); }
            } catch(e) { alert("Erro ao limpar."); btn.innerHTML = originalText; }
        }
    </script>
</body>
</html>
