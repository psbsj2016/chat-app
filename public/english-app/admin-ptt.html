<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG Admin Max - Inglês PTT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --bg-color: #05050A; --card-bg: rgba(15, 23, 42, 0.9); --primary: #3B82F6; --success: #10B981; --danger: #EF4444; --text-main: #F8FAFC; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .header h1 { font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; flex: 1; overflow: hidden; }
        
        .panel { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .panel-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: white; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 10px; }

        .core-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .core-btn { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid transparent; background: rgba(255,255,255,0.05); color: #CBD5E1; font-weight: 800; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; font-size: 13px; }
        .core-btn.active-blue { background: rgba(59, 130, 246, 0.15); border-color: var(--primary); color: var(--primary); }
        .core-btn.active-green { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 6px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; background: #0B0F19; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 8px; font-size: 14px; transition: 0.2s; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        textarea { resize: vertical; min-height: 70px; }
        
        .dynamic-fields { padding: 15px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.15); margin-top: 15px; }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 20px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59,130,246,0.4); }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); margin-top: 10px; }
        .btn-danger:hover { background: var(--danger); color: white; box-shadow: 0 5px 15px rgba(239,68,68,0.4); }

        .exercise-card { background: #0B0F19; border-left: 4px solid var(--primary); padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: relative; }
        .exercise-card.listening { border-color: #10B981; }
        .exercise-card.speaking { border-color: #F59E0B; }
        .exercise-card.reading { border-color: #8B5CF6; }
        .exercise-card.writing { border-color: #3B82F6; }
        .exercise-card.training { border-color: #EC4899; }
        
        .ex-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; background: rgba(255,255,255,0.1); }
        .ex-difficulty { position: absolute; top: 15px; right: 15px; font-size: 10px; font-weight: 900; color: #F59E0B; background: rgba(245, 158, 11, 0.1); padding: 4px 8px; border-radius: 6px; }
        
        .ex-text { font-size: 15px; font-weight: 700; margin-bottom: 5px; color: white; }
        .ex-details { font-size: 12px; color: #94A3B8; display: flex; flex-direction: column; gap: 4px; line-height: 1.4; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="material-icons-round" style="font-size: 32px;">dashboard_customize</span> Centro de Comando PTT</h1>
        <div style="font-size: 13px; font-weight: 600; color: #94A3B8; display: flex; align-items: center; gap: 5px;">
            <div style="width:8px; height:8px; background:#10B981; border-radius:50%; box-shadow:0 0 10px #10B981;"></div>
            Arquitetura Neural Online
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <div class="panel-title"><span>1. Forjar Armamento (Exercício)</span></div>

            <div class="core-selector">
                <div class="core-btn active-blue" id="btn-estrutural" onclick="selectCore('estrutural')">
                    <span class="material-icons-round">account_tree</span> 🔵 Estrutural (Base)
                </div>
                <div class="core-btn" id="btn-performance" onclick="selectCore('performance')">
                    <span class="material-icons-round">speed</span> 🟢 Performance (Treino)
                </div>
            </div>

            <input type="hidden" id="core-type" value="estrutural">

            <div class="form-row">
                <div class="form-group">
                    <label>Domínio / Destino</label>
                    <select id="nodeId" onchange="updateExerciseTypes(); loadSavedExercises();">
                        <optgroup label="🔵 NÚCLEO ESTRUTURAL" id="opt-estrutural">
                            <option value="phonetics_1">Fonética 1: Sons e Vibrações</option>
                            <option value="syntax_1">Sintaxe 1: Lógica SVO e Ordem</option>
                            <option value="semantics_1">Semântica 1: Sentidos e Contexto</option>
                        </optgroup>
                        <optgroup label="🟢 NÚCLEO PERFORMANCE" id="opt-performance" class="hidden">
                            <option value="skill_listening">🎧 Listening (Escuta)</option>
                            <option value="skill_speaking">🎙️ Speaking (Fala)</option>
                            <option value="skill_reading">📖 Reading (Leitura)</option>
                            <option value="skill_writing">✍️ Writing (Escrita & Digitação)</option>
                            <option value="skill_training">🏋️ Training (Treinamento Misto)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mecânica Dinâmica</label>
                    <select id="type" onchange="toggleFields()">
                        </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Dificuldade</label>
                    <select id="difficulty">
                        <option value="1">Lvl 1 - Recruta (Lento)</option>
                        <option value="2">Lvl 2 - Iniciante</option>
                        <option value="3">Lvl 3 - Intermediário</option>
                        <option value="4">Lvl 4 - Avançado</option>
                        <option value="5">Lvl 5 - Nativo (Rápido)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Voz TTS</label>
                    <select id="voiceProfile">
                        <option value="en-US-male">🇺🇸 US Masculino</option>
                        <option value="en-US-female">🇺🇸 US Feminino</option>
                        <option value="en-GB-male">🇬🇧 UK Masculino</option>
                        <option value="en-GB-female">🇬🇧 UK Feminino</option>
                        <option value="en-US-young">🇺🇸 US Dinâmico (Jovem)</option>
                        <option value="audiobook">📚 Audiobook (Narrador)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Instrução Principal (Para o aluno)</label>
                <input type="text" id="text" placeholder="Ex: Selecione o som correto / Traduza a frase..." required>
            </div>

            <div id="dynamic-zone" class="dynamic-fields"></div>

            <div class="form-row" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Objetivo Pedagógico</label>
                    <input type="text" id="pedagogicObj" placeholder="Ex: Diferenciar P de B">
                </div>
                <div class="form-group">
                    <label>Tags (vírgula)</label>
                    <input type="text" id="tags" placeholder="Ex: business, travel">
                </div>
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Dica Neuro-Cognitiva (Exibida no erro)</label>
                <textarea id="advTip" placeholder="Explique a lógica ou a posição da boca..."></textarea>
            </div>

            <button class="btn-submit" id="submitBtn" onclick="injectExercise()"><span class="material-icons-round">rocket_launch</span> Injetar no Servidor</button>
        </div>

        <div class="panel" style="background: rgba(15, 23, 42, 0.5);">
            <div class="panel-title">
                <span>2. Arsenal da Fase Selecionada</span>
                <button onclick="loadSavedExercises()" style="background:transparent; border:none; color:var(--primary); cursor:pointer; padding:5px;"><span class="material-icons-round">sync</span></button>
            </div>
            <div id="arsenal-status" style="font-size: 13px; color: #94A3B8; margin-bottom: 15px;">Sincronizando com o Quartel General...</div>
            <div id="arsenal-list" style="display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding-right: 5px;"></div>
            
            <button class="btn-submit btn-danger" id="clearBtn" onclick="clearPhase()"><span class="material-icons-round">delete_sweep</span> Expurgo Total da Fase</button>
        </div>
    </div>

    <script>
        function selectCore(core) {
            document.getElementById('core-type').value = core;
            const btnEst = document.getElementById('btn-estrutural');
            const btnPerf = document.getElementById('btn-performance');
            const optEst = document.getElementById('opt-estrutural');
            const optPerf = document.getElementById('opt-performance');

            if(core === 'estrutural') {
                btnEst.className = 'core-btn active-blue'; btnPerf.className = 'core-btn';
                optEst.classList.remove('hidden'); optPerf.classList.add('hidden');
                document.getElementById('nodeId').value = 'phonetics_1';
            } else {
                btnPerf.className = 'core-btn active-green'; btnEst.className = 'core-btn';
                optPerf.classList.remove('hidden'); optEst.classList.add('hidden');
                document.getElementById('nodeId').value = 'skill_listening';
            }
            updateExerciseTypes();
            loadSavedExercises();
        }

        // O CÉREBRO DAS OPÇÕES DINÂMICAS!
        function updateExerciseTypes() {
            const target = document.getElementById('nodeId').value;
            const typeSelect = document.getElementById('type');
            typeSelect.innerHTML = '';

            // LÓGICA ESTRUTURAL
            if (target.startsWith('phonetics')) {
                typeSelect.innerHTML += `<option value="listen_isolate">🔊 Fonética: Ouvir e Isolar Som</option>`;
                typeSelect.innerHTML += `<option value="minimal_pair">🎧 Fonética: Comparação (Minimal Pairs)</option>`;
            } else if (target.startsWith('syntax')) {
                typeSelect.innerHTML += `<option value="syntax_assembly">🧩 Sintaxe: Montagem Estrutural (SVO)</option>`;
                typeSelect.innerHTML += `<option value="grammar_rules">📐 Sintaxe: Escolha a Regra Certa</option>`;
            } else if (target.startsWith('semantics')) {
                typeSelect.innerHTML += `<option value="meaning_match">🧠 Semântica: Associação de Significado</option>`;
                typeSelect.innerHTML += `<option value="context_cloze">📖 Semântica: Lacuna por Contexto</option>`;
            } 
            // LÓGICA PERFORMANCE
            else if (target === 'skill_listening') {
                typeSelect.innerHTML += `<option value="dictation">⌨️ Dictation (Ditado de Áudio)</option>`;
                typeSelect.innerHTML += `<option value="audio_comprehension">🎧 Compreensão Auditiva (Quiz)</option>`;
            } else if (target === 'skill_speaking') {
                typeSelect.innerHTML += `<option value="repeat_sentence">🎙️ Fluência Rápida (Falar a Frase)</option>`;
                typeSelect.innerHTML += `<option value="free_speech">💬 Resposta Aberta com IA</option>`;
            } else if (target === 'skill_reading') {
                typeSelect.innerHTML += `<option value="speed_reading">⚡ Speed Reading (Leitura Dinâmica)</option>`;
                typeSelect.innerHTML += `<option value="true_false">✅ Verdadeiro ou Falso</option>`;
            } else if (target === 'skill_writing') {
                typeSelect.innerHTML += `<option value="fast_typing">⌨️ Digitação Ágil (Copiar rápido)</option>`;
                typeSelect.innerHTML += `<option value="translation">🌍 Tradução Imediata (PT -> EN)</option>`;
            } else if (target === 'skill_training') {
                typeSelect.innerHTML += `<option value="memorization">🔁 Memorização Rápida (Spaced Repetition)</option>`;
                typeSelect.innerHTML += `<option value="simultaneous_training">🔥 Treino 360 (Ouvir, Ler e Digitar)</option>`;
            }
            
            toggleFields();
        }

        // MOSTRA OS CAMPOS CERTOS PARA O EXERCÍCIO ESCOLHIDO
        function toggleFields() {
            const type = document.getElementById('type').value;
            const zone = document.getElementById('dynamic-zone');
            
            if (type === 'listen_isolate' || type === 'meaning_match') {
                zone.innerHTML = `
                    <div class="form-group"><label style="color:var(--success);">Oculto: Áudio TTS</label><input type="text" id="audioText" placeholder="Texto falado pelo robô"></div>
                    <div class="form-group"><label>IPA Fonético (opcional)</label><input type="text" id="ipa" placeholder="Ex: /pæt/"></div>`;
            } else if (type === 'minimal_pair' || type === 'audio_comprehension' || type === 'grammar_rules') {
                zone.innerHTML = `
                    <div class="form-group"><label>Opções de Botões (Separadas por vírgula)</label><input type="text" id="options" placeholder="Opção A, Opção B, Opção C"></div>
                    <div class="form-group"><label>Índice Correto (0, 1, 2...)</label><input type="number" id="answer" value="0"></div>
                    <div class="form-group"><label style="color:var(--success);">Áudio Associado (Opcional)</label><input type="text" id="audioText" placeholder="Deixe em branco se não tiver áudio"></div>`;
            } else if (type === 'syntax_assembly') {
                zone.innerHTML = `
                    <div class="form-group"><label>Blocos Desordenados (Vírgula)</label><input type="text" id="options" placeholder="coffee, like, I"></div>
                    <div class="form-group"><label>Frase Completa (Ordem SVO)</label><input type="text" id="answerStr" placeholder="I like coffee"></div>`;
            } else if (type === 'context_cloze') {
                zone.innerHTML = `
                    <div class="form-group"><label>Contexto Base</label><input type="text" id="context" placeholder="Situação inicial..."></div>
                    <div class="form-group"><label>Opções (Vírgula)</label><input type="text" id="options" placeholder="want, wants, wanting"></div>
                    <div class="form-group"><label>Índice Correto (0, 1, 2...)</label><input type="number" id="answer" value="0"></div>`;
            } else if (type === 'dictation' || type === 'fast_typing' || type === 'translation') {
                zone.innerHTML = `
                    <div class="form-group"><label style="color:var(--success);">Áudio de Suporte (TTS)</label><input type="text" id="audioText" placeholder="Texto para tocar no fundo"></div>
                    <div class="form-group"><label>Resposta Exata Exigida</label><input type="text" id="answerStr" placeholder="O que o aluno deve digitar..."></div>`;
            } else if (type === 'repeat_sentence' || type === 'free_speech') {
                zone.innerHTML = `
                    <div class="form-group"><label>Alvo do Algoritmo (O que a IA vai validar na fala)</label><input type="text" id="target" placeholder="Texto alvo"></div>
                    <div class="form-group"><label>Texto Exibido para Leitura</label><input type="text" id="displayWord" placeholder="Texto formatado"></div>`;
            } else if (type === 'true_false') {
                zone.innerHTML = `
                    <div class="form-group"><label>Resposta</label><select id="answer"><option value="1">Verdadeiro</option><option value="0">Falso</option></select></div>`;
            } else if (type === 'simultaneous_training' || type === 'memorization') {
                zone.innerHTML = `
                    <div class="form-group"><label style="color:var(--success);">Áudio Disparado (TTS)</label><input type="text" id="audioText" placeholder="Texto falado"></div>
                    <div class="form-group"><label>Ação ou Tradução Exigida (Atrás do Card)</label><input type="text" id="answerStr" placeholder="Significado ou ação..."></div>`;
            }
        }
        
        // Inicia os campos baseados no valor por defeito
        updateExerciseTypes();

        async function injectExercise() {
            const btn = document.getElementById('submitBtn');
            const type = document.getElementById('type').value;
            const core = document.getElementById('core-type').value;
            const targetId = document.getElementById('nodeId').value;
            
            const payload = {
                core: core,
                nodeId: targetId,
                exercise: {
                    type: type,
                    difficulty: parseInt(document.getElementById('difficulty').value),
                    voiceProfile: document.getElementById('voiceProfile').value,
                    pedagogicalObjective: document.getElementById('pedagogicObj').value,
                    tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t),
                    text: document.getElementById('text').value,
                    advTip: document.getElementById('advTip').value
                }
            };

            // Mapeamento Inteligente dos Dados conforme o Tipo
            const optEl = document.getElementById('options');
            if (optEl) payload.exercise.options = optEl.value.split(',').map(s => s.trim());
            
            const ansEl = document.getElementById('answer');
            if (ansEl) payload.exercise.answer = parseInt(ansEl.value);

            const ansStrEl = document.getElementById('answerStr');
            if (ansStrEl) payload.exercise.answer = ansStrEl.value.trim();

            const audEl = document.getElementById('audioText');
            if (audEl) payload.exercise.audioText = audEl.value;

            const ipaEl = document.getElementById('ipa');
            if (ipaEl) payload.exercise.ipa = ipaEl.value;

            const ctxEl = document.getElementById('context');
            if (ctxEl) payload.exercise.context = ctxEl.value;

            const trgEl = document.getElementById('target');
            if (trgEl) payload.exercise.target = trgEl.value;

            const dspEl = document.getElementById('displayWord');
            if (dspEl) payload.exercise.displayWord = dspEl.value;

            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> A Processar...`;
            
            try {
                const res = await fetch('/api/english/admin/inject', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.success) {
                    btn.style.background = "var(--success)"; btn.innerHTML = `<span class="material-icons-round">check_circle</span> Injetado!`;
                    setTimeout(() => { btn.style.background = ""; btn.innerHTML = `<span class="material-icons-round">rocket_launch</span> Engatilhar e Injetar`; }, 2000);
                    document.getElementById('text').value = ''; 
                    if(ansStrEl) ansStrEl.value = '';
                    loadSavedExercises(); 
                } else alert(data.message || data.error);
            } catch (e) { alert("Falha na rede."); btn.innerHTML = "Erro Crítico"; }
        }

        async function loadSavedExercises() {
            const nodeId = document.getElementById('nodeId').value;
            const statusEl = document.getElementById('arsenal-status');
            const listEl = document.getElementById('arsenal-list');
            statusEl.innerText = "A Escanear Servidor..."; listEl.innerHTML = '';

            try {
                const res = await fetch(`/api/english/node/${nodeId}`);
                const data = await res.json();

                if (data.success && data.exercises && data.exercises.length > 0) {
                    statusEl.innerHTML = `<b style="color:white;">${data.exercises.length}</b> Armamentos no Módulo.`;
                    data.exercises.forEach((ex, index) => {
                        let skillName = ex.type.toUpperCase().replace('_', ' '); 
                        let cssClass = "training"; 
                        let detailsHtml = "";

                        // Define Cores
                        if (ex.type.includes('listen') || ex.type.includes('audio') || ex.type === 'dictation') cssClass = 'listening';
                        else if (ex.type.includes('repeat') || ex.type.includes('speech')) cssClass = 'speaking';
                        else if (ex.type.includes('reading') || ex.type.includes('cloze')) cssClass = 'reading';
                        else if (ex.type.includes('assembly') || ex.type.includes('typing') || ex.type === 'translation') cssClass = 'writing';

                        if (ex.options) detailsHtml += `<b>Opções:</b> ${ex.options.join(' | ')}<br>`;
                        if (ex.answer !== undefined) detailsHtml += `<b>Correto:</b> ${ex.answer}<br>`;
                        if (ex.audioText) detailsHtml += `<b>Áudio:</b> ${ex.audioText}<br>`;
                        if (ex.target) detailsHtml += `<b>Validação IA:</b> ${ex.target}<br>`;

                        const tagHtml = (ex.tags && ex.tags.length > 0) ? `<div style="margin-top:5px; font-size:10px; color:var(--primary);">${ex.tags.map(t=>`#${t}`).join(' ')}</div>` : '';
                        const difHtml = ex.difficulty ? `<span class="ex-difficulty">Lvl ${ex.difficulty}</span>` : '';

                        listEl.innerHTML += `
                            <div class="exercise-card ${cssClass}">
                                ${difHtml}
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                                    <span class="ex-badge">${skillName}</span>
                                    <span style="font-size:11px; color:#64748B; font-weight:800;">Nº ${index + 1}</span>
                                </div>
                                <div class="ex-text">${ex.text || 'Sem instrução'}</div>
                                <div class="ex-details">${detailsHtml}${tagHtml}</div>
                            </div>
                        `;
                    });
                } else {
                    statusEl.innerText = "Aviso: Nenhuma missão cadastrada."; 
                    listEl.innerHTML = `<div style="text-align:center; color:#64748B; padding:30px; border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px;"><span class="material-icons-round" style="font-size:40px; margin-bottom:10px; opacity:0.5;">inventory_2</span><br>Base Vazia.</div>`;
                }
            } catch (e) { statusEl.innerText = "Falha ao conectar com a Base de Dados."; }
        }

        async function clearPhase() {
            if(!confirm("ALERTA MÁXIMO: Isto vai destruir TODAS as missões da fase selecionada. Tem certeza absoluta?")) return;
            const btn = document.getElementById('clearBtn'); const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-icons-round" style="animation: spin 1s infinite;">sync</span> Expurgo em Andamento...`;
            try {
                const res = await fetch('/api/english/admin/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nodeId: document.getElementById('nodeId').value }) });
                const data = await res.json();
                if(data.success) { btn.innerHTML = `<span class="material-icons-round">done_all</span> Base Limpa!`; setTimeout(() => { btn.innerHTML = originalText; }, 2000); loadSavedExercises(); }
            } catch(e) { alert("Erro ao limpar."); btn.innerHTML = originalText; }
        }
    </script>
</body>
</html>
