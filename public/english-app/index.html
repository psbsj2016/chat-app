<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inglês PTT - Neuroeducação</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05050A;
            --card-bg: rgba(15, 23, 42, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --som-color: #10B981;
            --logica-color: #3B82F6;
            --contexto-color: #8B5CF6;
            --daily-color: #F59E0B;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-y: auto; overflow-x: hidden; }
        
        .hidden { display: none !important; }
        .app-screen { min-height: 100vh; padding: 20px; display: flex; flex-direction: column; }

        /* --- DASHBOARD: MACRO DOMÍNIO E TREINO DIÁRIO --- */
        .mastery-header { background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.4)); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 25px 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .mastery-ring { width: 80px; height: 80px; border-radius: 50%; background: conic-gradient(var(--daily-color) 0%, var(--daily-color) 68%, rgba(255,255,255,0.1) 68%, rgba(255,255,255,0.1) 100%); display: flex; align-items: center; justify-content: center; position: relative; }
        .mastery-ring::before { content: ""; position: absolute; width: 64px; height: 64px; background: var(--bg-color); border-radius: 50%; }
        .mastery-score { position: relative; font-size: 20px; font-weight: 900; color: white; }
        
        .daily-workout-btn { background: linear-gradient(135deg, #F59E0B, #D97706); color: white; border: none; padding: 20px; border-radius: 16px; font-size: 18px; font-weight: 900; width: 100%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3); transition: 0.2s; margin-bottom: 30px; }
        .daily-workout-btn:active { transform: scale(0.97); }

        /* --- TRILHAS DE APRENDIZAGEM (SOM, LÓGICA, CONTEXTO) --- */
        .section-title { font-size: 14px; font-weight: 900; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; }
        .track-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.2s; position: relative; overflow: hidden; }
        .track-card:active { transform: scale(0.98); }
        .track-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .track-info { flex: 1; }
        .track-title { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .track-desc { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

        .track-som .track-icon { background: rgba(16, 185, 129, 0.1); color: var(--som-color); }
        .track-som .progress-bar-fill { background: var(--som-color); }
        .track-logica .track-icon { background: rgba(59, 130, 246, 0.1); color: var(--logica-color); }
        .track-logica .progress-bar-fill { background: var(--logica-color); }
        .track-contexto .track-icon { background: rgba(139, 92, 246, 0.1); color: var(--contexto-color); }
        .track-contexto .progress-bar-fill { background: var(--contexto-color); }

        /* --- MAPA LINEAR (NODES) --- */
        .map-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .map-path { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 20px 0; position: relative; }
        .map-path::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 4px; background: rgba(255,255,255,0.05); z-index: 0; }
        
        .node-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; margin-bottom: 30px; width: 100%; }
        .node-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid var(--card-bg); background: var(--bg-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .node-btn.locked { background: #1E293B; border-color: #334155; color: #64748B; cursor: not-allowed; }
        .node-btn.unlocked { background: var(--primary); border-color: rgba(255,255,255,0.2); color: white; box-shadow: 0 0 20px rgba(59,130,246,0.5); }
        .node-btn.completed { background: var(--som-color); border-color: rgba(255,255,255,0.2); color: white; }
        .node-label { font-weight: 800; font-size: 14px; margin-top: 10px; text-align: center; }
        .node-desc { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: center; }

        /* --- TELA DE LIÇÃO E TOGGLE AVANÇADO --- */
        .lesson-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lesson-progress-container { flex: 1; margin: 0 20px; display: flex; gap: 5px; }
        .lesson-step { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; transition: 0.3s; }
        .lesson-step.active { background: var(--primary); }

        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* --- UI EXERCÍCIOS --- */
        .exercise-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px 0; }
        .ipa-text { font-family: monospace; font-size: 22px; color: var(--primary); font-weight: bold; margin-bottom: 10px; letter-spacing: 2px; }
        .instruction-text { font-size: 18px; font-weight: 800; margin-bottom: 25px; line-height: 1.4; }
        .advanced-tip { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); padding: 15px; border-radius: 12px; font-size: 13px; color: #93C5FD; font-weight: 600; margin-bottom: 20px; text-align: left; width: 100%; display: flex; align-items: center; gap: 10px; }
        
        .play-btn { background: var(--primary); color: white; border: none; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px auto; cursor: pointer; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); transition: 0.2s; }
        .play-btn:active { transform: scale(0.9); }
        
        .mic-btn { background: var(--som-color); color: white; border: none; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 20px auto; cursor: pointer; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: 0.3s; }
        .mic-btn.recording { background: var(--danger); animation: pulse 1.5s infinite; box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 20px; }
        .option-btn { background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1); padding: 20px 10px; border-radius: 16px; font-size: 18px; font-weight: 800; color: white; cursor: pointer; transition: 0.2s; }
        .option-btn.selected { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
        .option-btn.correct { border-color: var(--som-color); background: rgba(16, 185, 129, 0.1); color: var(--som-color); }
        .option-btn.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .action-footer { margin-top: auto; padding-top: 20px; }
        .action-btn { background: var(--card-bg); color: var(--text-muted); border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 900; width: 100%; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .action-btn.ready { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4); }
        .action-btn.success { background: var(--som-color); color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4); }

        .target-word { font-size: 32px; font-weight: 900; margin: 15px 0; color: white; }
        .feedback-text { min-height: 24px; font-weight: 800; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="dashboard-screen" class="app-screen">
        <div class="mastery-header">
            <div class="mastery-ring">
                <span class="mastery-score" id="global-fluency">68%</span>
            </div>
            <div>
                <h1 style="font-size: 22px; font-weight: 900; margin: 0; letter-spacing: -0.5px;">Fluência Global</h1>
                <p style="margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 600;">Nível: Em desenvolvimento</p>
            </div>
        </div>

        <button class="daily-workout-btn" onclick="startDailyWorkout()">
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="material-icons-round" style="font-size: 32px;">bolt</span>
                <div style="text-align: left;">
                    <div style="font-size: 18px; font-weight: 900;">Treino Diário</div>
                    <div style="font-size: 12px; font-weight: 600; opacity: 0.9;">10 exercícios inteligentes</div>
                </div>
            </div>
            <span class="material-icons-round">play_circle_filled</span>
        </button>

        <div class="section-title">As 3 Trilhas de Aprendizagem</div>
        
        <div class="track-card track-som" onclick="openMap('som')">
            <div class="track-icon"><span class="material-icons-round" style="font-size: 32px;">record_voice_over</span></div>
            <div class="track-info">
                <div class="track-title">Som (Fonética)</div>
                <div class="track-desc">Fase 1 • Consoantes Simples</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 45%;"></div></div>
            </div>
        </div>

        <div class="track-card track-logica" onclick="openMap('logica')">
            <div class="track-icon"><span class="material-icons-round" style="font-size: 32px;">account_tree</span></div>
            <div class="track-info">
                <div class="track-title">Lógica (Sintaxe)</div>
                <div class="track-desc">Fase 2 • Ordem SVO</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 20%;"></div></div>
            </div>
        </div>

        <div class="track-card track-contexto" onclick="openMap('contexto')">
            <div class="track-icon"><span class="material-icons-round" style="font-size: 32px;">travel_explore</span></div>
            <div class="track-info">
                <div class="track-title">Contexto (Semântica)</div>
                <div class="track-desc">Fase 1 • Sobrevivência</div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 80%;"></div></div>
            </div>
        </div>
    </div>

    <div id="map-screen" class="app-screen hidden">
        <div class="map-header">
            <button class="icon-btn" onclick="backToDashboard()" style="background: rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; border:none; color:white; cursor:pointer;"><span class="material-icons-round">arrow_back</span></button>
            <div>
                <h2 id="map-title" style="font-size: 20px; font-weight: 900;">Som (Fonética)</h2>
                <p style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Estrutura Linear Obrigatória</p>
            </div>
        </div>
        <div class="map-path" id="map-nodes-container">
            </div>
    </div>

    <div id="lesson-screen" class="app-screen hidden" style="position: absolute; top:0; left:0; width:100%; z-index: 100; background: var(--bg-color);">
        <div class="lesson-header">
            <button class="icon-btn" onclick="abortLesson()" style="background: transparent; border:none; color:var(--text-muted); cursor:pointer;"><span class="material-icons-round">close</span></button>
            <div class="lesson-progress-container" id="lesson-progress">
                <div class="lesson-step active"></div><div class="lesson-step"></div><div class="lesson-step"></div><div class="lesson-step"></div><div class="lesson-step"></div>
            </div>
            <div class="toggle-container">
                IPA <label class="switch"><input type="checkbox" id="advanced-mode-toggle" onchange="toggleAdvancedMode()"><span class="slider"></span></label>
            </div>
        </div>

        <div class="exercise-area" id="exercise-area">
            </div>

        <div class="action-footer">
            <p id="lesson-feedback" class="feedback-text"></p>
            <button id="btn-action" class="action-btn" onclick="handleLessonAction()">Verificar</button>
        </div>
    </div>

    <script>
        // --- 1. MOCK DATABASE (ESTRUTURA LINEAR) ---
        const somNodes = [
            { id: 'som_1', title: '/p/ vs /b/', desc: 'Consoantes Bilabiais', status: 'unlocked', icon: 'record_voice_over' },
            { id: 'som_2', title: '/t/ vs /d/', desc: 'Consoantes Alveolares', status: 'locked', icon: 'lock' },
            { id: 'som_3', title: '/æ/ vs /ɛ/', desc: 'Vogais Curtas 1', status: 'locked', icon: 'lock' }
        ];

        // Rampa de 5 exercícios fixos para o Node "som_1"
        const currentExerciseQueue = [
            { type: 'listen_isolate', ipa: '/p/', text: "Ouça o som isolado de /p/", advTip: "Articulação: Bilabial plosiva. Garganta SEM vibração.", audio: "p_sound" },
            { type: 'minimal_pair', ipa: '/p/ vs /b/', text: "Qual som você ouviu?", advTip: "Diferença: Vibração nas cordas vocais.", options: ["Pat", "Bat"], answer: 0 },
            { type: 'repeat_isolate', ipa: '/p/', text: "Grave apenas o som /p/", advTip: "Solte o ar com força pelos lábios.", target: "p" },
            { type: 'repeat_word', ipa: '/pæt/', text: "Fale a palavra", advTip: "Atenção ao som seco no início.", target: "pat", displayWord: "Pat" },
            { type: 'repeat_sentence', ipa: "...", text: "Fale a frase completa", advTip: "Mantenha a fluidez.", target: "pat has a pet", displayWord: "Pat has a pet." }
        ];

        // --- 2. ESTADO GLOBAL ---
        let currentTrack = '';
        let exerciseIndex = 0;
        let isAdvancedMode = false;
        let isRecording = false;
        let currentExercise = null;
        let selectedOption = null;
        let stepState = 'ready'; // ready, verified, finished

        // Configuração de Reconhecimento de Voz Nativo (Simulação)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognizer = null;
        if (SpeechRecognition) {
            recognizer = new SpeechRecognition();
            recognizer.lang = 'en-US';
            recognizer.interimResults = false;
            recognizer.maxAlternatives = 1;
            recognizer.onresult = (e) => evaluateSpeech(e.results[0][0].transcript);
            recognizer.onspeechend = () => stopMic();
            recognizer.onerror = () => { stopMic(); setFeedback("Não consegui ouvir. Tente novamente.", "var(--danger)"); };
        }

        // --- 3. NAVEGAÇÃO DE TELAS ---
        function openMap(track) {
            currentTrack = track;
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('map-screen').classList.remove('hidden');
            
            const titles = { 'som': 'Som (Fonética)', 'logica': 'Lógica (Sintaxe)', 'contexto': 'Contexto (Semântica)' };
            document.getElementById('map-title').innerText = titles[track];
            
            // Renderiza os nós linearmente (Apenas SOM mockado para demo)
            const container = document.getElementById('map-nodes-container');
            container.innerHTML = '';
            
            const nodesToRender = track === 'som' ? somNodes : [{id:'tbd', title:'Em Breve', desc:'Módulos em construção', status:'locked', icon:'lock'}];
            
            nodesToRender.forEach((node, i) => {
                const color = track === 'som' ? 'var(--som-color)' : track === 'logica' ? 'var(--logica-color)' : 'var(--contexto-color)';
                const btnClass = node.status === 'unlocked' ? 'unlocked' : node.status === 'completed' ? 'completed' : 'locked';
                const clickAction = node.status === 'unlocked' ? `onclick="startNodeLesson('${node.id}')"` : '';
                
                container.innerHTML += `
                    <div class="node-wrapper">
                        <div class="node-btn ${btnClass}" ${clickAction} style="${node.status !== 'locked' ? `background-color: ${color};` : ''}">
                            <span class="material-icons-round" style="font-size: 32px;">${node.icon}</span>
                        </div>
                        <div class="node-label">${node.title}</div>
                        <div class="node-desc">${node.desc}</div>
                    </div>
                `;
            });
        }

        function backToDashboard() {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
        }

        function startDailyWorkout() {
            alert("Gerando Treino Híbrido: 50% Fraquezas, 30% Atual, 20% Revisão.\nIniciando...");
            startNodeLesson('daily');
        }

        // --- 4. MOTOR DA TELA DE LIÇÃO ---
        function startNodeLesson(nodeId) {
            document.getElementById('map-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('lesson-screen').classList.remove('hidden');
            
            exerciseIndex = 0;
            updateProgressBars();
            loadExercise();
        }

        function abortLesson() {
            if(confirm("Abandonar treino? Seu progresso não será salvo.")) {
                if(isRecording) stopMic();
                window.speechSynthesis.cancel();
                document.getElementById('lesson-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
            }
        }

        function updateProgressBars() {
            const steps = document.querySelectorAll('.lesson-step');
            steps.forEach((step, i) => {
                step.classList.toggle('active', i <= exerciseIndex);
            });
        }

        function toggleAdvancedMode() {
            isAdvancedMode = document.getElementById('advanced-mode-toggle').checked;
            loadExercise(); // Recarrega a tela atual com/sem IPA
        }

        function loadExercise() {
            if (exerciseIndex >= currentExerciseQueue.length) {
                finishLesson(); return;
            }

            currentExercise = currentExerciseQueue[exerciseIndex];
            selectedOption = null;
            stepState = 'ready';
            setFeedback("", "");
            
            const area = document.getElementById('exercise-area');
            const btn = document.getElementById('btn-action');
            let html = '';

            // Bloco Avançado Condicional
            const advBlock = isAdvancedMode ? `
                <div class="ipa-text">${currentExercise.ipa}</div>
                <div class="advanced-tip"><span class="material-icons-round">info</span> ${currentExercise.advTip}</div>
            ` : '';

            // RENDERIZAÇÃO POR TIPO DE EXERCÍCIO
            if (currentExercise.type === 'listen_isolate') {
                html = `${advBlock}
                        <div class="instruction-text">${currentExercise.text}</div>
                        <button class="play-btn" onclick="playTTS('${currentExercise.ipa.replace(/\//g,'')}')"><span class="material-icons-round" style="font-size:40px;">volume_up</span></button>
                        <p style="color:var(--text-muted); font-size:12px;">Toque para ouvir</p>`;
                btn.innerText = "Continuar";
                btn.className = "action-btn ready";

            } else if (currentExercise.type === 'minimal_pair') {
                html = `${advBlock}
                        <div class="instruction-text">${currentExercise.text}</div>
                        <button class="play-btn" onclick="playTTS('${currentExercise.options[currentExercise.answer]}')"><span class="material-icons-round" style="font-size:40px;">volume_up</span></button>
                        <div class="options-grid" id="quiz-options">
                            ${currentExercise.options.map((opt, i) => `<div class="option-btn" onclick="selectOption(${i})">${opt}</div>`).join('')}
                        </div>`;
                btn.innerText = "Verificar";
                btn.className = "action-btn";

            } else if (currentExercise.type.startsWith('repeat')) {
                html = `${advBlock}
                        <div class="instruction-text">${currentExercise.text}</div>
                        ${currentExercise.displayWord ? `<div class="target-word">${currentExercise.displayWord}</div>` : ''}
                        <button class="mic-btn" id="mic-btn" onclick="toggleMic()"><span class="material-icons-round" style="font-size:40px;">mic</span></button>
                        <p id="mic-status" style="color:var(--text-muted); font-size:12px;">Toque para gravar</p>`;
                btn.innerText = "Verificar Gravação";
                btn.className = "action-btn";
            }

            area.innerHTML = html;
        }

        // --- 5. INTERAÇÕES E VALIDAÇÕES ---
        function playTTS(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.8;
            window.speechSynthesis.speak(u);
        }

        function selectOption(idx) {
            if(stepState !== 'ready') return;
            selectedOption = idx;
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((b, i) => b.classList.toggle('selected', i === idx));
            document.getElementById('btn-action').className = "action-btn ready";
        }

        function toggleMic() {
            if(!recognizer) return alert("Microfone não suportado.");
            const micBtn = document.getElementById('mic-btn');
            if(isRecording) { stopMic(); } else {
                isRecording = true;
                micBtn.classList.add('recording');
                document.getElementById('mic-status').innerText = "Escutando...";
                recognizer.start();
            }
        }
        function stopMic() {
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            if(micBtn) micBtn.classList.remove('recording');
            if(recognizer) recognizer.stop();
        }

        function evaluateSpeech(transcript) {
            const cleanT = transcript.toLowerCase().trim();
            const target = currentExercise.target.toLowerCase();
            document.getElementById('mic-status').innerText = `Você disse: "${transcript}"`;
            
            // Simulação de Score Backend
            if (cleanT.includes(target) || target.includes(cleanT) || target === 'p') {
                setFeedback("Precisão: 95% - Excelente!", "var(--som-color)");
                document.getElementById('btn-action').innerText = "Continuar";
                document.getElementById('btn-action').className = "action-btn success";
                stepState = 'verified';
            } else {
                setFeedback("Precisão: 40% - Faltou explosão labial.", "var(--danger)");
            }
        }

        function setFeedback(msg, color) {
            const fb = document.getElementById('lesson-feedback');
            fb.innerText = msg; fb.style.color = color;
        }

        function handleLessonAction() {
            if (currentExercise.type === 'listen_isolate') {
                nextExercise();
            } else if (currentExercise.type === 'minimal_pair') {
                if (stepState === 'ready' && selectedOption !== null) {
                    const btns = document.querySelectorAll('.option-btn');
                    if (selectedOption === currentExercise.answer) {
                        btns[selectedOption].classList.add('correct');
                        setFeedback("Perfeito! Ouvido calibrado.", "var(--som-color)");
                        document.getElementById('btn-action').className = "action-btn success";
                    } else {
                        btns[selectedOption].classList.add('wrong');
                        btns[currentExercise.answer].classList.add('correct');
                        setFeedback("Incorreto. Era o outro som.", "var(--danger)");
                        document.getElementById('btn-action').className = "action-btn";
                    }
                    document.getElementById('btn-action').innerText = "Continuar";
                    stepState = 'verified';
                } else if (stepState === 'verified') {
                    nextExercise();
                }
            } else if (currentExercise.type.startsWith('repeat')) {
                if (stepState === 'verified') nextExercise();
                else alert("Grave sua voz primeiro clicando no microfone.");
            }
        }

        function nextExercise() {
            exerciseIndex++;
            updateProgressBars();
            loadExercise();
        }

        function finishLesson() {
            document.getElementById('exercise-area').innerHTML = `
                <span class="material-icons-round" style="font-size:80px; color:var(--daily-color); margin-bottom:20px;">emoji_events</span>
                <h2 style="font-size:24px; font-weight:900; margin-bottom:10px;">Sessão Concluída!</h2>
                <p style="color:var(--text-muted); font-weight:600;">+25 XP de Domínio Fonético</p>
            `;
            document.getElementById('btn-action').innerText = "Voltar ao QG";
            document.getElementById('btn-action').className = "action-btn ready";
            document.getElementById('btn-action').onclick = () => {
                document.getElementById('lesson-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');
                // Simula aumento de fluência global
                document.getElementById('global-fluency').innerText = "71%";
            };
        }
    </script>
</body>
</html>
